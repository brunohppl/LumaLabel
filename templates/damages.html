<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Damages · LUMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#1a1714;--accent:#b8935a;--green:#4a7c59;--red:#e85c47;--muted:#9a8f80;--border:#e0d8ce;--sand:#f0ebe4;--warm:#faf8f4;}
body{background:var(--warm);color:var(--ink);font-family:'Jost',sans-serif;min-height:100vh;}

/* NAV */
header{background:var(--ink);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;letter-spacing:0.1em;color:#faf8f4;white-space:nowrap;}
.logo em{font-style:italic;color:var(--accent);}
.nav-links{display:flex;gap:16px;flex-wrap:wrap;}
.nav-link{color:rgba(250,248,244,0.45);text-decoration:none;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s;white-space:nowrap;}
.nav-link:hover,.nav-link.active{color:var(--accent);}
@media(max-width:480px){header{padding:12px 16px;}.logo{font-size:1.2rem;}.nav-link{font-size:0.68rem;letter-spacing:0.06em;}.nav-links{gap:12px;}}

/* PAGE */
.page{max-width:900px;margin:0 auto;padding:28px 20px 60px;}
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:400;}
.btn-add{width:44px;height:44px;border-radius:50%;background:var(--accent);color:white;border:none;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(184,147,90,0.4);transition:opacity 0.15s;flex-shrink:0;}
.btn-add:hover{opacity:0.88;}

/* GUIDE */
.guide-card{background:white;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px;}
.guide-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;}
.guide-hdr:hover{background:var(--sand);}
.guide-hdr-left{display:flex;align-items:center;gap:10px;}
.guide-hdr-icon{font-size:1.1rem;}
.guide-hdr-title{font-size:0.78rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink);}
.guide-chevron{font-size:0.75rem;color:var(--muted);transition:transform 0.2s;}
.guide-chevron.open{transform:rotate(180deg);}
.guide-body{display:none;padding:18px;border-top:1px solid var(--sand);}
.guide-body.open{display:block;}
.guide-steps{display:flex;flex-direction:column;gap:14px;}
.guide-step{display:flex;gap:14px;align-items:flex-start;}
.guide-step-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:white;font-size:0.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.guide-step-content{}
.guide-step-title{font-size:0.88rem;font-weight:600;color:var(--ink);margin-bottom:3px;}
.guide-step-desc{font-size:0.82rem;color:var(--muted);line-height:1.5;}
.guide-options{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.guide-opt{font-size:0.72rem;padding:3px 9px;border-radius:10px;background:var(--sand);color:var(--muted);font-weight:500;}
.guide-note{margin-top:16px;padding:12px 14px;background:rgba(184,147,90,0.07);border-radius:6px;font-size:0.82rem;color:var(--muted);line-height:1.5;border-left:3px solid var(--accent);}

.damage-group{margin-bottom:24px;}
.damage-group:last-child{margin-bottom:0;}
.damage-group-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:500;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.damage-group-count{font-size:0.68rem;background:var(--warm);color:var(--muted);border-radius:10px;padding:2px 9px;font-weight:600;font-family:'Jost',sans-serif;}
.damage-table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.damage-table th{background:var(--ink);color:rgba(250,248,244,0.8);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;padding:10px 14px;text-align:left;}
.damage-table td{padding:12px 14px;border-bottom:1px solid var(--sand);font-size:0.88rem;vertical-align:middle;}
.damage-table tr:last-child td{border-bottom:none;}
.damage-table tr:hover td{background:var(--sand);}
.damage-thumb{width:48px;height:48px;object-fit:cover;border-radius:2px;border:1px solid var(--border);cursor:pointer;margin-right:4px;}
.damage-thumb:hover{border-color:var(--accent);}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.72rem;font-weight:600;letter-spacing:0.04em;}
.tag-location{background:rgba(74,126,184,0.1);color:#2e5a8a;}
.tag-damage{background:rgba(232,92,71,0.1);color:#a63d2f;}
.tag-furniture{background:rgba(184,147,90,0.1);color:#8a5c1a;}
.del-btn{background:none;border:none;color:var(--border);cursor:pointer;font-size:1rem;padding:4px;transition:color 0.15s;}
.del-btn:hover{color:var(--red);}
@media(max-width:600px){
  .damage-table thead{display:none;}
  .damage-table,.damage-table tbody,.damage-table tr,.damage-table td{display:block;width:100%;}
  .damage-table tr{background:white;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;padding:12px 14px;position:relative;}
  .damage-table td{padding:3px 0;border:none;}
  .damage-table td:first-child{font-size:0.72rem;color:var(--muted);margin-bottom:4px;}
  .damage-table td:last-child{position:absolute;top:8px;right:8px;width:auto;}
}
.empty{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--ink);margin-bottom:8px;}
.loading{text-align:center;padding:40px;color:var(--muted);}
.spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* WIZARD OVERLAY */
.wizard-overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,0.6);z-index:300;align-items:center;justify-content:center;padding:16px;}
.wizard-overlay.open{display:flex;}
.wizard-sheet{background:white;border-radius:12px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px 20px 28px;box-shadow:0 8px 40px rgba(0,0,0,0.25);animation:fadeScale 0.2s ease;}
@keyframes fadeScale{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
.wizard-step{display:none;}
.wizard-step.active{display:block;}
.wizard-q{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;color:var(--ink);margin-bottom:20px;line-height:1.3;}
@media(max-width:480px){.wizard-sheet{padding:20px 16px 24px;}.wizard-q{font-size:1.3rem;margin-bottom:14px;}.wizard-opt{padding:11px 8px;font-size:0.82rem;}.wizard-options{gap:8px;}}
.wizard-progress{display:flex;gap:6px;margin-bottom:22px;}
.wizard-dot{height:4px;border-radius:2px;flex:1;background:var(--border);transition:background 0.2s;}
.wizard-dot.done{background:var(--accent);}
.wizard-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.wizard-options.single{grid-template-columns:1fr;}
.wizard-opt{padding:14px 12px;border:1.5px solid var(--border);border-radius:8px;background:white;font-family:'Jost',sans-serif;font-size:0.9rem;font-weight:500;color:var(--ink);cursor:pointer;text-align:center;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.wizard-opt:hover{border-color:var(--accent);background:rgba(184,147,90,0.06);}
.wizard-opt.selected{border-color:var(--accent);background:rgba(184,147,90,0.1);color:var(--accent);}
.wizard-opt .opt-icon{font-size:1.3rem;}
.wizard-back{background:none;border:none;color:var(--muted);font-family:'Jost',sans-serif;font-size:0.82rem;cursor:pointer;padding:0;margin-top:18px;text-decoration:underline;}

/* PHOTO STEP */
.photo-actions{display:flex;gap:10px;margin-bottom:16px;}
.btn-photo{flex:1;padding:11px;border:1px solid var(--border);border-radius:6px;background:white;font-family:'Jost',sans-serif;font-size:0.85rem;cursor:pointer;color:var(--ink);transition:border-color 0.15s;}
.btn-photo:hover{border-color:var(--accent);}
.dmg-thumb-wrap{position:relative;width:72px;height:72px;flex-shrink:0;}
.dmg-thumb-wrap img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
.dmg-thumb-del{position:absolute;top:-5px;right:-5px;background:var(--red);color:white;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
.dmg-thumb-add{width:72px;height:72px;border:2px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--border);cursor:pointer;transition:border-color 0.15s;}
.dmg-thumb-add:hover{border-color:var(--accent);color:var(--accent);}
.btn-submit{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:8px;font-family:'Jost',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
.btn-submit:hover{opacity:0.88;}
.btn-skip{width:100%;padding:10px;background:none;border:none;color:var(--muted);font-family:'Jost',sans-serif;font-size:0.85rem;cursor:pointer;margin-top:8px;text-decoration:underline;}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:500;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:4px;}
.lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;color:white;font-size:2rem;cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="logo">LUMA <em>Design</em> Co</div>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/labels" class="nav-link">Labels</a>
    <a href="/jobs" class="nav-link">Jobs</a>
    <a href="/runsheet" class="nav-link">Runsheet</a>
    <a href="/catalogue" class="nav-link">Catalogue</a>
    <a href="/damages" class="nav-link active">Damages</a>
  </div>
</header>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <button class="lightbox-close">×</button>
  <img id="lightbox-img" src="" alt=""/>
</div>

<!-- Wizard -->
<div class="wizard-overlay" id="wizard-overlay">
  <div class="wizard-sheet">
    <div class="wizard-progress" id="wizard-progress">
      <div class="wizard-dot done" id="dot-0"></div>
      <div class="wizard-dot" id="dot-1"></div>
      <div class="wizard-dot" id="dot-2"></div>
      <div class="wizard-dot" id="dot-3"></div>
      <div class="wizard-dot" id="dot-4"></div>
      <div class="wizard-dot" id="dot-5"></div>
    </div>

    <!-- Step 0: Category -->
    <div class="wizard-step active" id="step-cat">
      <div class="wizard-q">What are you reporting?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="chooseCategory('furniture')"><span class="opt-icon">🛋️</span>Furniture Damage</button>
        <button class="wizard-opt" onclick="chooseCategory('property')"><span class="opt-icon">🏠</span>Property Damage</button>
      </div>
    </div>

    <!-- Step (property only): Job search -->
    <div class="wizard-step" id="step-job-search">
      <div class="wizard-q">Which job? <span style="font-weight:400;color:var(--muted);font-size:0.75rem;">(optional)</span></div>
      <input type="text" id="job-search-input" placeholder="Search job number or address…"
        style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:0.9rem;margin-bottom:10px;"
        oninput="onJobSearchInput(this.value)"/>
      <div id="job-search-results" style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:14px;"></div>
      <div id="job-search-selected" style="display:none;background:rgba(74,124,89,0.08);border:1px solid var(--green);border-radius:6px;padding:10px 12px;margin-bottom:14px;">
        <div style="font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;">Selected job</div>
        <div id="job-search-selected-text" style="font-weight:600;color:var(--ink);margin-top:2px;"></div>
        <button onclick="clearSelectedJob()" style="background:none;border:none;color:var(--red);font-size:0.75rem;cursor:pointer;padding:4px 0 0;">Remove</button>
      </div>
      <button class="btn-submit" onclick="showStep('0')" style="margin-bottom:8px;">Continue</button>
      <button class="btn-skip" onclick="skipJobSearch()">Skip — no job number</button>
      <button class="wizard-back" onclick="goBackToCategory()">← Back</button>
    </div>

    <!-- Step 1: Where (furniture — all 4 options) -->
    <div class="wizard-step" id="step-0">
      <div class="wizard-q">Where did it happen?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="choose(0,'location','pickup')"><span class="opt-icon">🚛</span>Pickup</button>
        <button class="wizard-opt" onclick="choose(0,'location','install')"><span class="opt-icon">🏠</span>Install</button>
        <button class="wizard-opt" onclick="choose(0,'location','transport')"><span class="opt-icon">🛣️</span>Transport</button>
        <button class="wizard-opt" onclick="choose(0,'location','warehouse')"><span class="opt-icon">🏭</span>Warehouse</button>
      </div>
      <button class="wizard-back" onclick="goBackToCategory()">← Back</button>
    </div>

    <!-- Step 1b: Where (property — only pickup/install) -->
    <div class="wizard-step" id="step-prop-where">
      <div class="wizard-q">Where did it happen?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="choose(0,'location','pickup')"><span class="opt-icon">🚛</span>Pickup</button>
        <button class="wizard-opt" onclick="choose(0,'location','install')"><span class="opt-icon">🏠</span>Install</button>
      </div>
      <button class="wizard-back" onclick="showStep('job-search')">← Back</button>
    </div>


    <!-- Step 2: Damage type (furniture) -->
    <div class="wizard-step" id="step-1">
      <div class="wizard-q">What type of damage?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="choose(1,'damage_type','scratch')"><span class="opt-icon">〰️</span>Scratch</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','dent')"><span class="opt-icon">💢</span>Dent</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','broken_leg')"><span class="opt-icon">🦵</span>Broken leg</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','broken_top')"><span class="opt-icon">⬛</span>Broken top</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','tear')"><span class="opt-icon">✂️</span>Tear</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','crack')"><span class="opt-icon">💥</span>Crack</button>
      </div>
      <button class="wizard-back" onclick="goBack(1)">← Back</button>
    </div>

    <!-- Step 3: Furniture type -->
    <div class="wizard-step" id="step-2">
      <div class="wizard-q">What type of furniture?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="choose(2,'furniture','sofa')"><span class="opt-icon">🛋️</span>Sofa</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','table')"><span class="opt-icon">🟫</span>Table</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','chair')"><span class="opt-icon">💺</span>Chair</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','rug')"><span class="opt-icon">⬜</span>Rug</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','storage_unit')"><span class="opt-icon">🗄️</span>Storage unit</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','bedhead')"><span class="opt-icon">🛏️</span>Bedhead</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','accessories')"><span class="opt-icon">📦</span>Accessories</button>
      </div>
      <button class="wizard-back" onclick="goBack(2)">← Back</button>
    </div>

    <!-- Step 1b: Property damage type -->
    <div class="wizard-step" id="step-prop-type">
      <div class="wizard-q">What type of damage?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="choose(1,'damage_type','scratch')"><span class="opt-icon">〰️</span>Scratch</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','dent')"><span class="opt-icon">💢</span>Dent</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','hole')"><span class="opt-icon">⚫</span>Hole</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','crack')"><span class="opt-icon">💥</span>Crack</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','paint_chip')"><span class="opt-icon">🎨</span>Paint chip</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','stain')"><span class="opt-icon">🟤</span>Stain</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','broken')"><span class="opt-icon">💔</span>Broken</button>
      </div>
      <button class="wizard-back" onclick="goBack(1)">← Back</button>
    </div>

    <!-- Step 2b: Property element -->
    <div class="wizard-step" id="step-prop-element">
      <div class="wizard-q">Where on the property?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="choose(2,'property_element','wall')"><span class="opt-icon">🧱</span>Wall</button>
        <button class="wizard-opt" onclick="choose(2,'property_element','floor')"><span class="opt-icon">◻️</span>Floor</button>
        <button class="wizard-opt" onclick="choose(2,'property_element','stairway')"><span class="opt-icon">🪜</span>Stairway</button>
        <button class="wizard-opt" onclick="choose(2,'property_element','door')"><span class="opt-icon">🚪</span>Door</button>
        <button class="wizard-opt" onclick="choose(2,'property_element','doorframe')"><span class="opt-icon">🖼️</span>Door frame</button>
        <button class="wizard-opt" onclick="choose(2,'property_element','ceiling')"><span class="opt-icon">⬜</span>Ceiling</button>
        <button class="wizard-opt" onclick="choose(2,'property_element','skirting')"><span class="opt-icon">📏</span>Skirting board</button>
        <button class="wizard-opt" onclick="choose(2,'property_element','other')"><span class="opt-icon">❓</span>Other</button>
      </div>
      <button class="wizard-back" onclick="goBack(2)">← Back</button>
    </div>

    <!-- Step 4: Photos + notes -->
    <div class="wizard-step" id="step-3">
      <div class="wizard-q">Add photos</div>
      <input type="file" accept="image/*" capture="environment" id="photo-cam" style="display:none;" onchange="handlePhoto(this)"/>
      <input type="file" accept="image/*" id="photo-lib" style="display:none;" onchange="handlePhoto(this)"/>

      <!-- Photo thumbnail strip -->
      <div id="photo-strip" style="display:flex;flex-wrap:wrap;gap:8px;min-height:72px;margin-bottom:14px;"></div>

      <div class="photo-actions">
        <button class="btn-photo" onclick="document.getElementById('photo-cam').click()">📷 Camera</button>
        <button class="btn-photo" onclick="document.getElementById('photo-lib').click()">🖼️ Library</button>
      </div>

      <textarea id="wizard-notes" placeholder="Add notes (optional)…"
        style="width:100%;min-height:64px;margin-top:12px;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:0.85rem;resize:vertical;"
        oninput="_wizardData.notes=this.value"></textarea>

      <button class="btn-submit" onclick="submitReport()">Submit Report</button>
      <button class="btn-skip" onclick="submitReport(true)">Skip photos & submit</button>
      <button class="wizard-back" onclick="goBack(3)">← Back</button>
    </div>
  </div>
</div>

<div class="page">
  <div class="page-hdr">
    <div>
      <h1 class="page-title">Damage Reports</h1>
    </div>
    <button class="btn-add" onclick="openWizard()" title="Log new damage">+</button>
  </div>
  <div id="table-wrap"><div class="loading"><div class="spinner"></div>Loading…</div></div>
</div>

  damage_type:{scratch:'Scratch',dent:'Dent',broken_leg:'Broken leg',broken_top:'Broken top',tear:'Tear',crack:'Crack',hole:'Hole',paint_chip:'Paint chip',stain:'Stain',broken:'Broken'},
  furniture:  {sofa:'Sofa',table:'Table',chair:'Chair',rug:'Rug',storage_unit:'Storage unit',bedhead:'Bedhead',accessories:'Accessories'},
  property_element: {wall:'Wall',floor:'Floor',stairway:'Stairway',door:'Door',doorframe:'Door frame',ceiling:'Ceiling',skirting:'Skirting board',other:'Other'},
};

let reports = [];
let _wizardData = {};
let _photos = []; // array of {dataUrl, file} objects
let _editingId = null; // set when editing an existing report
let _existingPhotoUrl = null; // existing photo(s) when editing

// ── Table ──
async function loadReports(){
  try{
    const res = await fetch('/api/damages');
    reports = await res.json();
    renderTable();
  }catch(e){
    document.getElementById('table-wrap').innerHTML='<div class="empty"><div class="empty-title">Failed to load reports</div></div>';
  }
}

function renderTable(){
  const wrap = document.getElementById('table-wrap');
  if(!reports.length){
    wrap.innerHTML=`<div class="empty">
      <div class="empty-title">No damage reports yet</div>
      <p style="font-size:0.85rem;color:var(--muted);">Tap the + button to log one.</p>
    </div>`;
    return;
  }

  const furnitureReports = reports.filter(r=>r.report_category!=='property');
  const propertyReports  = reports.filter(r=>r.report_category==='property');

  wrap.innerHTML =
    reportGroupHTML('🛋️ Furniture Damage', furnitureReports, false) +
    reportGroupHTML('🏠 Property Damage', propertyReports, true);
}

function reportId(r){
  return r.report_number ? `DMG-${String(r.report_number).padStart(4,'0')}` : `#${(r.id||'').slice(0,8)}`;
}

function reportGroupHTML(title, list, isProperty){
  if(!list.length){
    return `<div class="damage-group">
      <div class="damage-group-title">${title} <span class="damage-group-count">0</span></div>
      <div class="empty" style="padding:20px;"><p style="font-size:0.82rem;color:var(--muted);margin:0;">No reports in this group yet.</p></div>
    </div>`;
  }
  return `<div class="damage-group">
    <div class="damage-group-title">${title} <span class="damage-group-count">${list.length}</span></div>
    <table class="damage-table">
      <thead><tr>
        <th>Report</th>
        <th>Date</th>
        <th>Where</th>
        <th>Damage</th>
        <th>Item / Element</th>
        <th>Photo</th>
        <th></th>
      </tr></thead>
      <tbody>
        ${list.map(r=>`<tr>
          <td style="white-space:nowrap;font-family:monospace;font-size:0.78rem;color:var(--accent);font-weight:600;">${reportId(r)}</td>
          <td style="white-space:nowrap;color:var(--muted);font-size:0.8rem;">${formatDate(r.created_at)}</td>
          <td><span class="tag tag-location">${LABELS.location[r.location]||r.location}</span></td>
          <td><span class="tag tag-damage">${LABELS.damage_type[r.damage_type]||r.damage_type}</span></td>
          <td><span class="tag tag-furniture">${isProperty ? (LABELS.property_element[r.property_element]||r.property_element||'—') : (LABELS.furniture[r.furniture]||r.furniture)}</span>
            ${isProperty && r.job_ref_snapshot ? `<div style="font-size:0.7rem;color:var(--muted);margin-top:3px;">${r.job_ref_snapshot}</div>` : ''}
          </td>
          <td>${(() => {
            if(!r.photo_url) return '<span style="color:var(--border);font-size:0.8rem;">—</span>';
            let urls;
            try{ urls=JSON.parse(r.photo_url); if(!Array.isArray(urls)) urls=[r.photo_url]; }
            catch(e){ urls=[r.photo_url]; }
            return urls.map(u=>`<img class="damage-thumb" src="${u}" onclick="openLightbox('${u}')" alt="damage photo" style="margin-right:4px;"/>`).join('');
          })()}</td>
          <td style="white-space:nowrap;">
            <button class="del-btn" onclick="editReport('${r.id}')" title="Edit" style="color:var(--muted);margin-right:4px;">✎</button>
            <button class="del-btn" onclick="deleteReport('${r.id}')" title="Delete">✕</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function formatDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})
    +' '+d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
}

async function deleteReport(id){
  if(!confirm('Delete this damage report?')) return;
  await fetch(`/api/damages/${id}`,{method:'DELETE'});
  reports = reports.filter(r=>r.id!==id);
  renderTable();
}

function openLightbox(url){
  document.getElementById('lightbox-img').src=url;
  document.getElementById('lightbox').classList.add('open');
}

// ── Wizard ──
function openWizard(){
  _wizardData={};_photos=[];_editingId=null;_existingPhotoUrl=null;_selectedJob=null;
  renderPhotoStrip();
  const notesEl=document.getElementById('wizard-notes');
  if(notesEl) notesEl.value='';
  const jobSearchInput=document.getElementById('job-search-input');
  if(jobSearchInput) jobSearchInput.value='';
  document.getElementById('job-search-results').innerHTML='';
  document.getElementById('job-search-selected').style.display='none';
  showStep('cat');
  document.getElementById('wizard-overlay').classList.add('open');
}

function chooseCategory(cat){
  _wizardData.report_category=cat;
  event.currentTarget.classList.add('selected');
  setTimeout(()=>{
    if(cat==='property'){
      showStep('job-search');
    } else {
      showStep('0');
    }
  }, 220);
}

function goBackToCategory(){
  showStep('cat');
}

// ── Job search (property damage only) ──
let _allJobsCache=null;
let _selectedJob=null;

async function ensureJobsLoaded(){
  if(_allJobsCache) return _allJobsCache;
  try{
    const res=await fetch('/api/jobs');
    _allJobsCache=await res.json();
  }catch(e){ _allJobsCache=[]; }
  return _allJobsCache;
}

// Matches label logic: strip non-digits, take last 3
function shortJobNumber(job){
  const raw=job?.job_number||job?.job_ref||'';
  const digits=raw.replace(/\D/g,'');
  return digits ? digits.slice(-3) : (raw||'—');
}

async function onJobSearchInput(query){
  const resultsEl=document.getElementById('job-search-results');
  const q=query.trim().toLowerCase();
  if(!q){ resultsEl.innerHTML=''; return; }
  const jobs=await ensureJobsLoaded();
  const matches=jobs.filter(j=>
    (j.job_number||'').toLowerCase().includes(q) ||
    (j.job_ref||'').toLowerCase().includes(q) ||
    (j.address||'').toLowerCase().includes(q)
  ).slice(0,8);
  if(!matches.length){
    resultsEl.innerHTML='<div style="font-size:0.8rem;color:var(--muted);padding:6px 2px;">No jobs found</div>';
    return;
  }
  resultsEl.innerHTML=matches.map(j=>`
    <button onclick='selectJob(${JSON.stringify(j.id)})' style="text-align:left;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 11px;cursor:pointer;font-family:inherit;">
      <div style="font-weight:600;font-size:0.85rem;color:var(--ink);">#${shortJobNumber(j)}</div>
      <div style="font-size:0.75rem;color:var(--muted);margin-top:1px;">${j.address||''}</div>
    </button>
  `).join('');
}

async function selectJob(jobId){
  const jobs=await ensureJobsLoaded();
  const job=jobs.find(j=>j.id===jobId);
  if(!job) return;
  _selectedJob=job;
  _wizardData.job_id=job.id;
  _wizardData.job_ref_snapshot=`#${shortJobNumber(job)} — ${job.address||''}`;
  document.getElementById('job-search-input').value='';
  document.getElementById('job-search-results').innerHTML='';
  document.getElementById('job-search-selected').style.display='block';
  document.getElementById('job-search-selected-text').textContent=_wizardData.job_ref_snapshot;
}

function clearSelectedJob(){
  _selectedJob=null;
  _wizardData.job_id=null;
  _wizardData.job_ref_snapshot=null;
  document.getElementById('job-search-selected').style.display='none';
}

function skipJobSearch(){
  clearSelectedJob();
  showStep('0');
}

function editReport(id){
  const r=reports.find(x=>x.id===id);
  if(!r) return;
  _editingId=id;
  _wizardData={
    location:r.location, damage_type:r.damage_type, furniture:r.furniture,
    report_category:r.report_category||'furniture', property_element:r.property_element,
    notes:r.notes||'', job_id:r.job_id||null, job_ref_snapshot:r.job_ref_snapshot||null
  };
  _photos=[];
  _existingPhotoUrl=r.photo_url||null;
  if(r.job_id && r.job_ref_snapshot){
    document.getElementById('job-search-selected').style.display='block';
    document.getElementById('job-search-selected-text').textContent=r.job_ref_snapshot;
  } else {
    document.getElementById('job-search-selected').style.display='none';
  }
  showStep('0');
  setTimeout(()=>{
    const whereStepId = _wizardData.report_category==='property' ? '#step-prop-where' : '#step-0';
    document.querySelectorAll(`${whereStepId} .wizard-opt`).forEach(btn=>{
      btn.classList.toggle('selected', btn.getAttribute('onclick')?.includes(`'${r.location}'`));
    });
    const typeStepId = _wizardData.report_category==='property' ? '#step-prop-type' : '#step-1';
    document.querySelectorAll(`${typeStepId} .wizard-opt`).forEach(btn=>{
      btn.classList.toggle('selected', btn.getAttribute('onclick')?.includes(`'${r.damage_type}'`));
    });
    if(_wizardData.report_category==='property'){
      document.querySelectorAll('#step-prop-element .wizard-opt').forEach(btn=>{
        btn.classList.toggle('selected', btn.getAttribute('onclick')?.includes(`'${r.property_element}'`));
      });
    } else {
      document.querySelectorAll('#step-2 .wizard-opt').forEach(btn=>{
        btn.classList.toggle('selected', btn.getAttribute('onclick')?.includes(`'${r.furniture}'`));
      });
    }
  },50);
  showStep('3');
  const notesEl=document.getElementById('wizard-notes');
  if(notesEl) notesEl.value=r.notes||'';
  // Show existing photos as a note
  const strip=document.getElementById('photo-strip');
  if(strip && _existingPhotoUrl){
    let urls;
    try{ urls=JSON.parse(_existingPhotoUrl); if(!Array.isArray(urls)) urls=[_existingPhotoUrl]; }
    catch(e){ urls=[_existingPhotoUrl]; }
    strip.innerHTML=urls.map(u=>`<div class="dmg-thumb-wrap"><img src="${u}" style="width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border);opacity:0.6;"/><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.6rem;color:var(--muted);text-align:center;line-height:1.2;">existing</div></div>`).join('')
      +`<div class="dmg-thumb-add" onclick="document.getElementById('photo-cam').click()">+</div>`;
  } else {
    renderPhotoStrip();
  }
  document.getElementById('wizard-overlay').classList.add('open');
}

function closeWizard(){
  document.getElementById('wizard-overlay').classList.remove('open');
  _editingId=null;_existingPhotoUrl=null;
}

// Step names: 'cat', 'job-search', '0' (where), '1' (type), '2' (sub), '3' (photos)
function showStep(name){
  const isProperty = _wizardData.report_category==='property';
  const stepIdMap = {
    'cat':'step-cat',
    'job-search':'step-job-search',
    '0': isProperty ? 'step-prop-where' : 'step-0',
    '1': isProperty ? 'step-prop-type' : 'step-1',
    '2': isProperty ? 'step-prop-element' : 'step-2',
    '3':'step-3',
  };
  const targetId = stepIdMap[name] || name;
  document.querySelectorAll('.wizard-step').forEach(s=>s.classList.remove('active'));
  const target=document.getElementById(targetId);
  if(target) target.classList.add('active');
  // Progress dots
  const order=['cat','job-search','0','1','2','3'];
  const idx=order.indexOf(String(name));
  document.querySelectorAll('.wizard-dot').forEach((d,i)=>d.classList.toggle('done',i<=idx));
}

function choose(step, key, value){
  _wizardData[key]=value;
  event.currentTarget.classList.add('selected');
  const nextStep = String(step+1);
  setTimeout(()=>showStep(nextStep), 220);
}

function goBack(step){
  showStep(step-1);
}

// ── Photo handling ──
function renderPhotoStrip(){
  const strip=document.getElementById('photo-strip');
  if(!strip) return;
  strip.innerHTML=_photos.map((p,i)=>`
    <div class="dmg-thumb-wrap">
      <img src="${p.dataUrl}" alt="photo ${i+1}"/>
      <button class="dmg-thumb-del" onclick="removePhoto(${i})">✕</button>
    </div>`).join('')
    +`<div class="dmg-thumb-add" onclick="document.getElementById('photo-cam').click()">+</div>`;
}

function removePhoto(i){
  _photos.splice(i,1);
  renderPhotoStrip();
}

function handlePhoto(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    _photos.push({dataUrl:e.target.result, file});
    renderPhotoStrip();
  };
  reader.readAsDataURL(file);
  input.value='';
}

async function uploadPhoto(file){
  const compressed=await compressImage(file,1200,0.75);
  const path=`damage_${Date.now()}_${Math.random().toString(36).slice(2,6)}.jpg`;
  const res=await fetch(`${SB_URL}/storage/v1/object/item-photos/${path}`,{
    method:'POST',
    headers:{'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'image/jpeg','cache-control':'3600'},
    body:compressed,
  });
  if(!res.ok) throw new Error('Upload failed');
  return `${SB_URL}/storage/v1/object/public/item-photos/${path}`;
}

function compressImage(file,maxWidth,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1,maxWidth/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale;canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(blob=>resolve(blob),'image/jpeg',quality);
      URL.revokeObjectURL(url);
    };
    img.onerror=reject;img.src=url;
  });
}

async function submitReport(skipPhotos=false){
  const btn=document.querySelector('.btn-submit');
  btn.textContent='Saving…';btn.disabled=true;
  try{
    let photoUrl=_existingPhotoUrl; // keep existing by default
    if(!skipPhotos && _photos.length){
      // Upload new photos and replace existing
      const urls=await Promise.all(_photos.map(p=>uploadPhoto(p.file)));
      photoUrl=urls.length===1?urls[0]:JSON.stringify(urls);
    }

    if(_editingId){
      // Edit existing report
      await fetch(`/api/damages/${_editingId}`,{
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({..._wizardData, photo_url:photoUrl}),
      });
      const idx=reports.findIndex(r=>r.id===_editingId);
      if(idx!==-1) reports[idx]={...reports[idx],..._wizardData,photo_url:photoUrl};
    } else {
      // Create new report
      const res=await fetch('/api/damages',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({..._wizardData,photo_url:photoUrl}),
      });
      const data=await res.json();
      if(data.report) reports.unshift(data.report);
    }

    renderTable();
    closeWizard();
  }catch(e){
    alert('Failed to save report. Please try again.');
  }finally{
    btn.textContent='Submit Report';btn.disabled=false;
  }
}

loadReports();
</script>
</body>
