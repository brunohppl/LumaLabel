<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Damages · LUMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#1a1714;--accent:#b8935a;--green:#4a7c59;--red:#e85c47;--muted:#9a8f80;--border:#e0d8ce;--sand:#f0ebe4;--warm:#faf8f4;}
body{background:var(--warm);color:var(--ink);font-family:'Jost',sans-serif;min-height:100vh;}

/* NAV */
header{background:var(--ink);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;letter-spacing:0.1em;color:#faf8f4;white-space:nowrap;}
.logo em{font-style:italic;color:var(--accent);}
.nav-links{display:flex;gap:16px;flex-wrap:wrap;}
.nav-link{color:rgba(250,248,244,0.45);text-decoration:none;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s;white-space:nowrap;}
.nav-link:hover,.nav-link.active{color:var(--accent);}
@media(max-width:480px){header{padding:12px 16px;}.logo{font-size:1.2rem;}.nav-link{font-size:0.68rem;letter-spacing:0.06em;}.nav-links{gap:12px;}}

/* PAGE */
.page{max-width:900px;margin:0 auto;padding:28px 20px 60px;}
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:400;}
.btn-add{width:44px;height:44px;border-radius:50%;background:var(--accent);color:white;border:none;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(184,147,90,0.4);transition:opacity 0.15s;flex-shrink:0;}
.btn-add:hover{opacity:0.88;}

/* TABLE */
.damage-table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.damage-table th{background:var(--ink);color:rgba(250,248,244,0.8);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;padding:10px 14px;text-align:left;}
.damage-table td{padding:12px 14px;border-bottom:1px solid var(--sand);font-size:0.88rem;vertical-align:middle;}
.damage-table tr:last-child td{border-bottom:none;}
.damage-table tr:hover td{background:var(--sand);}
.damage-thumb{width:48px;height:48px;object-fit:cover;border-radius:2px;border:1px solid var(--border);cursor:pointer;}
.damage-thumb:hover{border-color:var(--accent);}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.72rem;font-weight:600;letter-spacing:0.04em;}
.tag-location{background:rgba(74,126,184,0.1);color:#2e5a8a;}
.tag-damage{background:rgba(232,92,71,0.1);color:#a63d2f;}
.tag-furniture{background:rgba(184,147,90,0.1);color:#8a5c1a;}
.del-btn{background:none;border:none;color:var(--border);cursor:pointer;font-size:1rem;padding:4px;transition:color 0.15s;}
.del-btn:hover{color:var(--red);}
.empty{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--ink);margin-bottom:8px;}
.loading{text-align:center;padding:40px;color:var(--muted);}
.spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* WIZARD OVERLAY */
.wizard-overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,0.6);z-index:300;align-items:flex-end;justify-content:center;}
.wizard-overlay.open{display:flex;}
.wizard-sheet{background:white;border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:28px 24px 40px;box-shadow:0 -8px 40px rgba(0,0,0,0.2);animation:slideUp 0.25s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.wizard-step{display:none;}
.wizard-step.active{display:block;}
.wizard-q{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;color:var(--ink);margin-bottom:20px;line-height:1.3;}
.wizard-progress{display:flex;gap:6px;margin-bottom:22px;}
.wizard-dot{height:4px;border-radius:2px;flex:1;background:var(--border);transition:background 0.2s;}
.wizard-dot.done{background:var(--accent);}
.wizard-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.wizard-options.single{grid-template-columns:1fr;}
.wizard-opt{padding:14px 12px;border:1.5px solid var(--border);border-radius:8px;background:white;font-family:'Jost',sans-serif;font-size:0.9rem;font-weight:500;color:var(--ink);cursor:pointer;text-align:center;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.wizard-opt:hover{border-color:var(--accent);background:rgba(184,147,90,0.06);}
.wizard-opt.selected{border-color:var(--accent);background:rgba(184,147,90,0.1);color:var(--accent);}
.wizard-opt .opt-icon{font-size:1.3rem;}
.wizard-back{background:none;border:none;color:var(--muted);font-family:'Jost',sans-serif;font-size:0.82rem;cursor:pointer;padding:0;margin-top:18px;text-decoration:underline;}

/* PHOTO STEP */
.photo-preview-wrap{width:100%;aspect-ratio:4/3;background:var(--sand);border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;margin-bottom:14px;}
.photo-preview-wrap img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.photo-preview-placeholder{text-align:center;color:var(--muted);}
.photo-preview-placeholder .cam-icon{font-size:2.5rem;display:block;margin-bottom:8px;}
.photo-preview-placeholder p{font-size:0.85rem;}
.photo-actions{display:flex;gap:10px;margin-bottom:16px;}
.btn-photo{flex:1;padding:11px;border:1px solid var(--border);border-radius:6px;background:white;font-family:'Jost',sans-serif;font-size:0.85rem;cursor:pointer;color:var(--ink);transition:border-color 0.15s;}
.btn-photo:hover{border-color:var(--accent);}
.btn-submit{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:8px;font-family:'Jost',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:opacity 0.15s;}
.btn-submit:hover{opacity:0.88;}
.btn-skip{width:100%;padding:10px;background:none;border:none;color:var(--muted);font-family:'Jost',sans-serif;font-size:0.85rem;cursor:pointer;margin-top:8px;text-decoration:underline;}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:500;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:4px;}
.lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;color:white;font-size:2rem;cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="logo">LUMA <em>Design</em> Co</div>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/labels" class="nav-link">Labels</a>
    <a href="/jobs" class="nav-link">Jobs</a>
    <a href="/runsheet" class="nav-link">Runsheet</a>
    <a href="/catalogue" class="nav-link">Catalogue</a>
    <a href="/damages" class="nav-link active">Damages</a>
  </div>
</header>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <button class="lightbox-close">×</button>
  <img id="lightbox-img" src="" alt=""/>
</div>

<!-- Wizard -->
<div class="wizard-overlay" id="wizard-overlay">
  <div class="wizard-sheet">
    <div class="wizard-progress" id="wizard-progress">
      <div class="wizard-dot done" id="dot-0"></div>
      <div class="wizard-dot" id="dot-1"></div>
      <div class="wizard-dot" id="dot-2"></div>
      <div class="wizard-dot" id="dot-3"></div>
    </div>

    <!-- Step 1: Where -->
    <div class="wizard-step active" id="step-0">
      <div class="wizard-q">Where did it happen?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="choose(0,'location','pickup')"><span class="opt-icon">🚛</span>Pickup</button>
        <button class="wizard-opt" onclick="choose(0,'location','install')"><span class="opt-icon">🏠</span>Install</button>
        <button class="wizard-opt" onclick="choose(0,'location','transport')"><span class="opt-icon">🛣️</span>Transport</button>
        <button class="wizard-opt" onclick="choose(0,'location','warehouse')"><span class="opt-icon">🏭</span>Warehouse</button>
      </div>
    </div>

    <!-- Step 2: Damage type -->
    <div class="wizard-step" id="step-1">
      <div class="wizard-q">What type of damage?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="choose(1,'damage_type','scratch')"><span class="opt-icon">〰️</span>Scratch</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','dent')"><span class="opt-icon">💢</span>Dent</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','broken_leg')"><span class="opt-icon">🦵</span>Broken leg</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','broken_top')"><span class="opt-icon">⬛</span>Broken top</button>
        <button class="wizard-opt" onclick="choose(1,'damage_type','tear')"><span class="opt-icon">✂️</span>Tear</button>
      </div>
      <button class="wizard-back" onclick="goBack(1)">← Back</button>
    </div>

    <!-- Step 3: Furniture type -->
    <div class="wizard-step" id="step-2">
      <div class="wizard-q">What type of furniture?</div>
      <div class="wizard-options">
        <button class="wizard-opt" onclick="choose(2,'furniture','sofa')"><span class="opt-icon">🛋️</span>Sofa</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','table')"><span class="opt-icon">🟫</span>Table</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','chair')"><span class="opt-icon">💺</span>Chair</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','rug')"><span class="opt-icon">⬜</span>Rug</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','storage_unit')"><span class="opt-icon">🗄️</span>Storage unit</button>
        <button class="wizard-opt" onclick="choose(2,'furniture','bedhead')"><span class="opt-icon">🛏️</span>Bedhead</button>
      </div>
      <button class="wizard-back" onclick="goBack(2)">← Back</button>
    </div>

    <!-- Step 4: Photo -->
    <div class="wizard-step" id="step-3">
      <div class="wizard-q">Take a photo</div>
      <input type="file" accept="image/*" capture="environment" id="photo-cam" style="display:none;" onchange="handlePhoto(this)"/>
      <input type="file" accept="image/*" id="photo-lib" style="display:none;" onchange="handlePhoto(this)"/>
      <div class="photo-preview-wrap" id="photo-preview-wrap" onclick="document.getElementById('photo-cam').click()">
        <img id="photo-preview-img" src="" alt="" style="display:none;"/>
        <div class="photo-preview-placeholder" id="photo-placeholder">
          <span class="cam-icon">📷</span>
          <p>Tap to take a photo</p>
        </div>
      </div>
      <div class="photo-actions">
        <button class="btn-photo" onclick="document.getElementById('photo-cam').click()">📷 Camera</button>
        <button class="btn-photo" onclick="document.getElementById('photo-lib').click()">🖼️ Library</button>
      </div>
      <button class="btn-submit" onclick="submitReport()">Submit Report</button>
      <button class="btn-skip" onclick="submitReport(true)">Skip photo & submit</button>
      <button class="wizard-back" onclick="goBack(3)">← Back</button>
    </div>
  </div>
</div>

<div class="page">
  <div class="page-hdr">
    <div>
      <h1 class="page-title">Damage Reports</h1>
    </div>
    <button class="btn-add" onclick="openWizard()" title="Log new damage">+</button>
  </div>
  <div id="table-wrap"><div class="loading"><div class="spinner"></div>Loading…</div></div>
</div>

<script>
const SB_URL='https://aqgxojawmohhogkhcxdb.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxZ3hvamF3bW9oaG9na2hjeGRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NDc5ODYsImV4cCI6MjA5NDMyMzk4Nn0.-2UOdGY52jDEmCmBBtQA2XEy6dVT8ZPA_AIPcM7RFX4';

const LABELS = {
  location:   {pickup:'Pickup',install:'Install',transport:'Transport',warehouse:'Warehouse'},
  damage_type:{scratch:'Scratch',dent:'Dent',broken_leg:'Broken leg',broken_top:'Broken top',tear:'Tear'},
  furniture:  {sofa:'Sofa',table:'Table',chair:'Chair',rug:'Rug',storage_unit:'Storage unit',bedhead:'Bedhead'},
};

let reports = [];
let _wizardData = {};
let _photoFile = null;
let _photoDataUrl = null;

// ── Table ──
async function loadReports(){
  try{
    const res = await fetch('/api/damages');
    reports = await res.json();
    renderTable();
  }catch(e){
    document.getElementById('table-wrap').innerHTML='<div class="empty"><div class="empty-title">Failed to load reports</div></div>';
  }
}

function renderTable(){
  const wrap = document.getElementById('table-wrap');
  if(!reports.length){
    wrap.innerHTML=`<div class="empty">
      <div class="empty-title">No damage reports yet</div>
      <p style="font-size:0.85rem;color:var(--muted);">Tap the + button to log one.</p>
    </div>`;
    return;
  }
  wrap.innerHTML=`<table class="damage-table">
    <thead><tr>
      <th>Date</th>
      <th>Where</th>
      <th>Damage</th>
      <th>Furniture</th>
      <th>Photo</th>
      <th></th>
    </tr></thead>
    <tbody>
      ${reports.map(r=>`<tr>
        <td style="white-space:nowrap;color:var(--muted);font-size:0.8rem;">${formatDate(r.created_at)}</td>
        <td><span class="tag tag-location">${LABELS.location[r.location]||r.location}</span></td>
        <td><span class="tag tag-damage">${LABELS.damage_type[r.damage_type]||r.damage_type}</span></td>
        <td><span class="tag tag-furniture">${LABELS.furniture[r.furniture]||r.furniture}</span></td>
        <td>${r.photo_url
          ?`<img class="damage-thumb" src="${r.photo_url}" onclick="openLightbox('${r.photo_url}')" alt="damage photo"/>`
          :`<span style="color:var(--border);font-size:0.8rem;">—</span>`}</td>
        <td><button class="del-btn" onclick="deleteReport('${r.id}')" title="Delete">✕</button></td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function formatDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})
    +' '+d.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
}

async function deleteReport(id){
  if(!confirm('Delete this damage report?')) return;
  await fetch(`/api/damages/${id}`,{method:'DELETE'});
  reports = reports.filter(r=>r.id!==id);
  renderTable();
}

function openLightbox(url){
  document.getElementById('lightbox-img').src=url;
  document.getElementById('lightbox').classList.add('open');
}

// ── Wizard ──
function openWizard(){
  _wizardData={};_photoFile=null;_photoDataUrl=null;
  showStep(0);
  // Reset photo preview
  document.getElementById('photo-preview-img').style.display='none';
  document.getElementById('photo-placeholder').style.display='block';
  document.getElementById('wizard-overlay').classList.add('open');
}

function closeWizard(){
  document.getElementById('wizard-overlay').classList.remove('open');
}

function showStep(n){
  document.querySelectorAll('.wizard-step').forEach((s,i)=>s.classList.toggle('active',i===n));
  document.querySelectorAll('.wizard-dot').forEach((d,i)=>d.classList.toggle('done',i<=n));
}

function choose(step, key, value){
  _wizardData[key]=value;
  // Highlight selection briefly then advance
  event.currentTarget.classList.add('selected');
  setTimeout(()=>showStep(step+1), 220);
}

function goBack(step){
  showStep(step-1);
}

// ── Photo ──
function handlePhoto(input){
  const file=input.files[0];
  if(!file) return;
  _photoFile=file;
  const reader=new FileReader();
  reader.onload=e=>{
    _photoDataUrl=e.target.result;
    const img=document.getElementById('photo-preview-img');
    img.src=_photoDataUrl;
    img.style.display='block';
    document.getElementById('photo-placeholder').style.display='none';
  };
  reader.readAsDataURL(file);
  input.value='';
}

async function uploadPhoto(file){
  const compressed=await compressImage(file,1200,0.75);
  const path=`damage_${Date.now()}.jpg`;
  const res=await fetch(`${SB_URL}/storage/v1/object/item-photos/${path}`,{
    method:'POST',
    headers:{'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'image/jpeg','cache-control':'3600'},
    body:compressed,
  });
  if(!res.ok) throw new Error('Upload failed');
  return `${SB_URL}/storage/v1/object/public/item-photos/${path}`;
}

function compressImage(file,maxWidth,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1,maxWidth/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale;canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(blob=>resolve(blob),'image/jpeg',quality);
      URL.revokeObjectURL(url);
    };
    img.onerror=reject;img.src=url;
  });
}

async function submitReport(skipPhoto=false){
  const btn=document.querySelector('.btn-submit');
  btn.textContent='Saving…';btn.disabled=true;
  try{
    let photoUrl=null;
    if(!skipPhoto && _photoFile){
      photoUrl=await uploadPhoto(_photoFile);
    }
    const res=await fetch('/api/damages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({..._wizardData,photo_url:photoUrl}),
    });
    const data=await res.json();
    if(data.report) reports.unshift(data.report);
    renderTable();
    closeWizard();
  }catch(e){
    alert('Failed to save report. Please try again.');
  }finally{
    btn.textContent='Submit Report';btn.disabled=false;
  }
}

loadReports();
</script>
</body>
</html>
