<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Runsheet · LUMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#1a1714;--accent:#b8935a;--green:#4a7c59;--red:#e85c47;--blue:#2e5a8a;--purple:#6a3d8a;--muted:#9a8f80;--border:#e0d8ce;--sand:#f0ebe4;--warm:#faf8f4;}
body{background:var(--warm);color:var(--ink);font-family:'Jost',sans-serif;min-height:100vh;}
header{background:var(--ink);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;letter-spacing:0.1em;color:#faf8f4;white-space:nowrap;}
.logo em{font-style:italic;color:var(--accent);}
.nav-links{display:flex;gap:16px;flex-wrap:wrap;}
.nav-link{color:rgba(250,248,244,0.45);text-decoration:none;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s;white-space:nowrap;}
.nav-link:hover,.nav-link.active{color:var(--accent);}
@media(max-width:480px){header{padding:12px 16px;}.logo{font-size:1.2rem;}.nav-link{font-size:0.68rem;}.nav-links{gap:12px;}}
.page{padding:20px 16px 60px;}
.page-hdr{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;}
.dev-banner{background:rgba(184,147,90,0.1);border:1px solid rgba(184,147,90,0.3);border-radius:6px;padding:8px 14px;font-size:0.8rem;color:var(--accent);display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.team-view-link{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--green);color:white;text-decoration:none;border-radius:6px;font-size:0.78rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;margin-left:auto;}
.team-view-link:hover{opacity:0.88;}
.date-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.date-nav-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:1rem;color:var(--ink);}
.date-nav-btn:hover{background:var(--sand);}
.date-label{font-size:1rem;font-weight:600;min-width:200px;text-align:center;}
.btn-today{padding:6px 14px;background:var(--accent);color:white;border:none;border-radius:4px;font-family:'Jost',sans-serif;font-size:0.78rem;font-weight:600;cursor:pointer;}
.rs-wrap{overflow-x:auto;}
.rs-tray-label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 6px;}
.rs-tray{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--warm);border:1px dashed var(--border);border-radius:6px;margin-bottom:14px;}
.rs-tray-tile{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:5px;cursor:pointer;min-width:150px;color:white;font-size:0.78rem;transition:opacity 0.15s;}
.rs-tray-tile:hover{opacity:0.85;}
.rs-tray-tile.install{background:#5b9bd5;}
.rs-tray-tile.to_load{background:#6abf7a;}
.rs-tray-tile.pickup{background:#e07070;}
.rs-tray-tile-type{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;opacity:0.85;font-weight:700;}
.rs-tray-tile-ref{font-weight:600;}
.rs-tray-tile-addr{font-size:0.72rem;opacity:0.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.rs-grid{display:grid;position:relative;}
.rs-time{font-size:0.65rem;color:var(--muted);text-align:right;padding-right:8px;padding-top:4px;width:56px;}
.rs-team-hdr{border-radius:8px 8px 0 0;padding:12px;margin:0 3px;cursor:pointer;transition:opacity 0.15s;}
.rs-team-hdr:hover{opacity:0.88;}
.rs-team-hdr-fn{font-size:0.6rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:0.65;margin-bottom:3px;color:white;}
.rs-team-hdr-name{font-size:0.9rem;font-weight:600;color:white;margin-bottom:3px;}
.rs-team-hdr-sub{font-size:0.7rem;color:rgba(255,255,255,0.55);margin-top:2px;}
.rs-add-team-btn{border:2px dashed var(--border);border-radius:8px 8px 0 0;padding:12px;margin:0 3px;cursor:pointer;color:var(--muted);font-family:'Jost',sans-serif;font-size:0.82rem;display:flex;align-items:center;justify-content:center;gap:6px;min-width:150px;background:none;transition:all 0.15s;}
.rs-add-team-btn:hover{border-color:var(--accent);color:var(--accent);}
.rs-cell{border-top:1px solid var(--border);cursor:pointer;transition:background 0.12s;position:relative;margin:0 3px;}
.rs-cell:hover{background:rgba(184,147,90,0.05);}
.rs-tile{position:absolute;left:4px;right:4px;border-radius:5px;padding:5px 7px;overflow:hidden;cursor:pointer;z-index:2;border-left:3px solid transparent;transition:opacity 0.12s;}
.rs-tile:hover{opacity:0.88;}
.rs-tile-label{font-size:0.6rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.75;color:rgba(255,255,255,0.8);}
.rs-tile-ref{font-size:0.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:white;}
.rs-tile-addr{font-size:0.78rem;color:rgba(255,255,255,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rs-tile-note{font-size:0.65rem;color:rgba(255,255,255,0.7);font-style:italic;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rs-tile-gear{position:absolute;bottom:2px;right:3px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.4);font-size:0.68rem;padding:2px;}
.rs-tile.install{background:#5b9bd5;border-left-color:rgba(0,0,0,0.15);}
.rs-tile.pickup{background:#e07070;border-left-color:rgba(0,0,0,0.15);}
.rs-tile.to_load{background:#6abf7a;border-left-color:rgba(0,0,0,0.15);}
.rs-tile.task{background:#7a7060;border-left-color:rgba(0,0,0,0.15);}
.rs-tile.styling{background:var(--purple);border-left-color:rgba(0,0,0,0.15);}
.pop-overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,0.5);z-index:200;}
.pop-overlay.open{display:block;}
.pop{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:10px;padding:22px;width:min(420px,94vw);max-height:90vh;overflow-y:auto;z-index:201;box-shadow:0 12px 48px rgba(0,0,0,0.25);}
.pop.open{display:block;}
.pop-title{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:600;margin-bottom:14px;}
.fl{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block;margin-top:12px;}
.fi{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;font-family:'Jost',sans-serif;font-size:0.86rem;background:white;color:var(--ink);outline:none;}
.fi:focus{border-color:var(--accent);}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.chip{padding:5px 11px;border:1.5px solid var(--border);border-radius:20px;font-size:0.74rem;font-weight:600;cursor:pointer;background:white;transition:all 0.15s;font-family:'Jost',sans-serif;}
.chip.selected{border-color:var(--accent);background:rgba(184,147,90,0.1);color:var(--accent);}
.fn-btn{flex:1;padding:9px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:0.78rem;font-weight:600;cursor:pointer;background:white;transition:all 0.15s;font-family:'Jost',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;}
.fn-btn.active-transport{border-color:var(--blue);background:rgba(46,90,138,0.08);color:var(--blue);}
.fn-btn.active-styling{border-color:var(--purple);background:rgba(106,61,138,0.08);color:var(--purple);}
.fn-btn.active-warehouse{border-color:var(--accent);background:rgba(184,147,90,0.08);color:var(--accent);}
.pop-actions{display:flex;justify-content:flex-end;align-items:center;margin-top:18px;gap:8px;}
.btn{padding:8px 16px;border-radius:6px;font-family:'Jost',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;border:none;}
.btn-gold{background:var(--accent);color:white;}
.btn-outline{background:white;color:var(--ink);border:1px solid var(--border);}
.btn-red{background:none;color:var(--red);border:1px solid var(--red);font-size:0.74rem;}
.job-search-result{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--sand);font-size:0.84rem;}
.job-search-result:last-child{border-bottom:none;}
.job-search-result:hover{background:var(--sand);}
.jsr-ref{font-weight:700;color:var(--accent);margin-right:6px;}
.jsr-addr{color:var(--muted);font-size:0.77rem;}
.loading{text-align:center;padding:40px;color:var(--muted);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.template-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
</style>
</head>
<body>
<header>
  <div class="logo">LUMA <em>Design</em> Co</div>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/labels" class="nav-link">Labels</a>
    <a href="/jobs" class="nav-link">Jobs</a>
    <a href="/runsheet" class="nav-link active">Runsheet</a>
    <a href="/catalogue" class="nav-link">Catalogue</a>
    <a href="/damages" class="nav-link">Damages</a>
  </div>
</header>

<div class="page">
  <div class="page-hdr">
    <h1 class="page-title">Runsheet</h1>
    <a href="/today" class="team-view-link">👥 Team View →</a>
  </div>
  <div class="dev-banner">🚧 Admin scheduling — set up teams and assign jobs for the day. Team members see their schedule at <strong>/runsheet</strong>.</div>

  <div class="date-row">
    <button class="date-nav-btn" onclick="shiftDate(-1)">‹</button>
    <div class="date-label" id="date-label"></div>
    <button class="date-nav-btn" onclick="shiftDate(1)">›</button>
    <button class="btn-today" onclick="goToday()">Today</button>
  </div>

  <div id="rs-tray-wrap" style="display:none;">
    <div class="rs-tray-label">Unscheduled — tap to assign team, time &amp; duration</div>
    <div class="rs-tray" id="rs-tray"></div>
  </div>

  <div class="rs-wrap">
    <div id="rs-grid"><div class="loading">Loading…</div></div>
  </div>
</div>

<!-- Team popover -->
<div class="pop-overlay" id="team-overlay" onclick="closeTeamPop()"></div>
<div class="pop" id="team-pop">
  <div class="pop-title" id="team-pop-title">Add Team</div>
  <input type="hidden" id="team-id"/>
  <label class="fl">Function</label>
  <div style="display:flex;gap:6px;" id="fn-btns">
    <button class="fn-btn" onclick="setFn('transport')">🚛 Transport</button>
    <button class="fn-btn" onclick="setFn('styling')">🎨 Styling</button>
    <button class="fn-btn" onclick="setFn('warehouse')">🏭 Warehouse</button>
  </div>
  <label class="fl">Name <span style="font-weight:400;text-transform:none;">(optional)</span></label>
  <input type="text" class="fi" id="team-name" placeholder="e.g. Nemo Crew, Morning Team…"/>
  <label class="fl">Vehicle</label>
  <div class="chip-row" id="vehicle-chips">
    <button class="chip" onclick="pickVehicle(this,'Bruce')">Bruce</button>
    <button class="chip" onclick="pickVehicle(this,'Nigel')">Nigel</button>
    <button class="chip" onclick="pickVehicle(this,'Nemo')">Nemo</button>
    <button class="chip" onclick="pickVehicle(this,'Marlin')">Marlin</button>
    <button class="chip" onclick="pickVehicle(this,'VUG')">VUG</button>
    <button class="chip" onclick="pickVehicle(this,'Own Car')">Own Car</button>
    <button class="chip" onclick="pickVehicle(this,'')">None</button>
  </div>
  <label class="fl">Lead</label>
  <select class="fi" id="team-lead"><option value="">— no lead —</option></select>
  <label class="fl">Members <span style="font-weight:400;text-transform:none;">(tap to add)</span></label>
  <div class="chip-row" id="member-chips"></div>
  <div style="margin-top:12px;display:flex;align-items:center;gap:8px;">
    <input type="checkbox" id="save-tmpl"/>
    <label for="save-tmpl" style="font-size:0.82rem;color:var(--muted);cursor:pointer;">Save as template</label>
  </div>
  <div id="tmpl-section" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--sand);">
    <div style="font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;">Load template</div>
    <div class="template-row" id="tmpl-list"></div>
  </div>
  <div class="pop-actions">
    <button class="btn btn-red" id="team-del-btn" style="display:none;margin-right:auto;" onclick="deleteTeam()">Delete</button>
    <button class="btn btn-outline" onclick="closeTeamPop()">Cancel</button>
    <button class="btn btn-gold" onclick="saveTeam()">Save</button>
  </div>
</div>

<!-- Entry popover -->
<div class="pop-overlay" id="entry-overlay" onclick="closeEntryPop()"></div>
<div class="pop" id="entry-pop">
  <div class="pop-title" id="entry-pop-title">Add Entry</div>
  <input type="hidden" id="entry-id"/>
  <input type="hidden" id="entry-team-id"/>
  <div id="entry-team-picker" style="display:none;margin-bottom:14px;">
    <label class="fl">Team</label>
    <select class="fi" id="entry-team-select" onchange="document.getElementById('entry-team-id').value=this.value;">
      <option value="">Select a team…</option>
    </select>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:14px;">
    <button class="fn-btn" id="mode-job"  onclick="setMode('job')"  style="flex:1;">🏠 Job</button>
    <button class="fn-btn" id="mode-task" onclick="setMode('task')" style="flex:1;">📝 Task</button>
  </div>
  <div id="job-fields">
    <label class="fl">Job</label>
    <input type="text" class="fi" id="job-search" placeholder="Job number or address…" oninput="searchJobs(this.value)"/>
    <div id="job-results" style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;display:none;margin-top:4px;"></div>
    <div id="job-selected" style="display:none;padding:7px 10px;background:var(--sand);border-radius:4px;font-size:0.84rem;margin-top:6px;justify-content:space-between;align-items:center;">
      <span id="job-selected-label"></span>
      <button onclick="clearJob()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;">✕</button>
    </div>
    <input type="hidden" id="job-id"/>
    <label class="fl">Type</label>
    <div class="chip-row" id="type-chips">
      <button class="chip selected" onclick="pickType(this,'install')">Install</button>
      <button class="chip" onclick="pickType(this,'pickup')">Pickup</button>
      <button class="chip" onclick="pickType(this,'to_load')">To Load</button>
    </div>
  </div>
  <div id="task-fields" style="display:none;">
    <label class="fl">Description</label>
    <input type="text" class="fi" id="task-title" placeholder="e.g. Stage sofa at bay B3, pick up linen…"/>
  </div>
  <div class="two-col" style="margin-top:12px;">
    <div><label class="fl">Start time</label><select class="fi" id="entry-time"></select></div>
    <div><label class="fl">Duration</label><select class="fi" id="entry-dur"></select></div>
  </div>
  <label class="fl">Notes <span style="font-weight:400;text-transform:none;">(optional)</span></label>
  <textarea class="fi" id="entry-notes" rows="2" placeholder="Access info, instructions…" style="resize:none;font-size:0.84rem;padding:8px 10px;"></textarea>
  <div class="pop-actions">
    <button class="btn btn-red" id="entry-del-btn" style="display:none;margin-right:auto;" onclick="deleteEntry()">Delete</button>
    <button class="btn btn-outline" onclick="closeEntryPop()">Cancel</button>
    <button class="btn btn-gold" onclick="saveEntry()">Save</button>
  </div>
</div>

<script>
const VEHICLES=['Bruce','Nigel','Nemo','Marlin','VUG','Own Car'];
const ALL_WORKERS=['Addy','Montie','Delphine','India','Hayley','Jo','Savio','Nick','Ayoub','Bruno','Phil','Tiago'];
const SLOTS=[];for(let h=7;h<=15;h++)for(let m=0;m<60;m+=30){if(h===15&&m>30)break;SLOTS.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);}
const DURS=[30,60,90,120,150,180,210,240];
const SLOT_H=46;
const FN_COL={transport:'#2e5a8a',styling:'#6a3d8a',warehouse:'#b8935a'};
const FN_LBL={transport:'🚛 Transport',styling:'🎨 Styling',warehouse:'🏭 Warehouse'};
const TYPE_LBL={install:'Install',to_load:'Load',pickup:'Pickup'};

let viewDate=new Date(),dayTeams=[],daySchedule=[],dayTasks=[],dayJobs=[],templates=[];
let _fn='transport',_vehicle='',_mode='job',_type='install',_jobId=null,_jsTimer=null;
let _loadSeq=0; // guards against out-of-order responses when navigating quickly

function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDate(d){return d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function shiftDate(n){viewDate=new Date(viewDate);viewDate.setDate(viewDate.getDate()+n);load();}
function goToday(){viewDate=new Date();load();}
function fmtSlot(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return`${h%12||12}:${String(m).padStart(2,'0')}${h<12?'am':'pm'}`;}
function slotIdx(t){if(!t)return 0;const[h,m]=t.split(':').map(Number);return Math.max(0,(h-7)*2+Math.floor(m/30));}

async function load(){
  const seq = ++_loadSeq; // this load's ticket — if a newer load starts before we finish, we discard our result
  document.getElementById('date-label').textContent=fmtDate(viewDate);
  document.getElementById('rs-grid').innerHTML='<div class="loading">Loading…</div>';
  const ds=localDate(viewDate);
  try{
    const[dr,tr]=await Promise.all([fetch(`/api/runsheet/${ds}`),fetch('/api/team-templates')]);
    const d=await dr.json();
    if(seq!==_loadSeq) return; // a newer load has since started — abandon this one
    dayTeams=d.teams||[];daySchedule=d.schedule||[];dayTasks=d.tasks||[];dayJobs=d.jobs||[];
    templates=await tr.json();
    if(seq!==_loadSeq) return;

    // Auto-seed four default teams if none exist for this day.
    // Re-checked right before insert to reduce (not fully eliminate) the
    // window for double-seeding when two loads race — the DB unique index
    // on (date, name) is the real guard; this just avoids the common case.
    if(!dayTeams.length){
      const defaults=[
        {name:'Nemo Crew',   vehicle:'Nemo',   function:'transport', sort_order:0},
        {name:'Bruce Crew',  vehicle:'Bruce',  function:'transport', sort_order:1},
        {name:'Nigel Crew',  vehicle:'Nigel',  function:'transport', sort_order:2},
        {name:'Styling',     vehicle:'Marlin', function:'styling',   sort_order:3},
      ];
      // Re-check immediately before seeding — closes most of the race window
      const recheck=await fetch(`/api/teams/${ds}`);
      const existing=await recheck.json();
      if(seq!==_loadSeq) return;
      if(!existing.length){
        await Promise.all(defaults.map(t=>
          fetch(`/api/teams/${ds}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)})
        ));
      }
      // Re-fetch with the seeded teams (or whatever another tab just created)
      const dr2=await fetch(`/api/runsheet/${ds}`);
      const d2=await dr2.json();
      if(seq!==_loadSeq) return;
      dayTeams=d2.teams||[];daySchedule=d2.schedule||[];dayTasks=d2.tasks||[];dayJobs=d2.jobs||[];
    }

    render();
    renderTray();
  }catch(e){
    if(seq===_loadSeq) document.getElementById('rs-grid').innerHTML='<div class="loading">Failed to load.</div>';
  }
}

function render(){
  const n=dayTeams.length;
  const timew=56,colw=Math.max(160,Math.floor((window.innerWidth-timew-40)/(n+1)));
  const cols=`${timew}px repeat(${n},${colw}px) ${Math.max(120,colw*0.7)}px`;
  const rows=`auto repeat(${SLOTS.length},${SLOT_H}px)`;

  let g=`<div style="display:grid;grid-template-columns:${cols};grid-template-rows:${rows};" id="rs-inner">`;

  // Header
  g+=`<div style="grid-column:1;grid-row:1;"></div>`;
  dayTeams.forEach((t,i)=>{
    const col=FN_COL[t.function]||'#1a1714';
    const others=(t.members||[]).filter(m=>m!==t.lead).join(', ');
    g+=`<div class="rs-team-hdr" style="grid-column:${i+2};grid-row:1;background:${col};" onclick="openTeamPop('${t.id}')">
      <div class="rs-team-hdr-fn">${FN_LBL[t.function]||t.function}</div>
      <div class="rs-team-hdr-name">${t.name||t.vehicle||'Team '+(i+1)}</div>
      ${t.vehicle?`<div class="rs-team-hdr-sub">Vehicle: ${t.vehicle}</div>`:''}
      ${t.lead?`<div class="rs-team-hdr-sub" style="color:rgba(255,255,255,0.9);font-weight:600;">Lead: ${t.lead}</div>`:''}
      ${others?`<div class="rs-team-hdr-sub">👥 ${others}</div>`:''}
    </div>`;
  });
  g+=`<button class="rs-add-team-btn" style="grid-column:${n+2};grid-row:1;" onclick="openTeamPop(null)">+ Add Team</button>`;

  // Time rows
  SLOTS.forEach((slot,si)=>{
    const row=si+2;
    const showLbl=slot.endsWith(':00');
    g+=`<div class="rs-time" style="grid-column:1;grid-row:${row};">${showLbl?fmtSlot(slot):''}</div>`;
    dayTeams.forEach((_,i)=>{
      g+=`<div class="rs-cell" style="grid-column:${i+2};grid-row:${row};" data-team="${i}" data-slot="${slot}" onclick="openEntryPop(null,'${dayTeams[i].id}','${slot}')"></div>`;
    });
    g+=`<div style="grid-column:${n+2};grid-row:${row};border-top:1px solid var(--border);"></div>`;
  });
  g+='</div>';

  document.getElementById('rs-grid').innerHTML=g;

  // Inject tiles
  const jobById=Object.fromEntries(dayJobs.map(j=>[j.id,j]));
  const byTeam={};
  dayTeams.forEach(t=>{byTeam[t.id]=[];});

  daySchedule.forEach(e=>{
    // team_id is the primary placement key. The vehicle-name fallback is kept
    // only as a safety net for entries saved before this change; new saves
    // always set team_id explicitly. Anything that resolves to neither is
    // caught by renderTray()'s orphan check so it's never silently lost.
    const tid=e.team_id||(dayTeams.find(t=>t.vehicle===e.vehicle)?.id);
    if(tid&&byTeam[tid]) byTeam[tid].push({...e,_task:false});
  });
  dayTasks.forEach(e=>{
    const tid=e.team_id||(dayTeams.find(t=>t.vehicle===e.vehicle||e.vehicle==='ALL')?.id);
    if(tid&&byTeam[tid]) byTeam[tid].push({...e,_task:true});
  });

  const inner=document.getElementById('rs-inner');
  dayTeams.forEach((team,ti)=>{
    const entries=(byTeam[team.id]||[]).filter(e=>e.start_time);

    // Detect overlapping groups and assign sub-columns
    // Each entry gets {entry, si, span, subCol, totalSubCols}
    const placed=entries.map(e=>{
      const si=slotIdx(e.start_time);
      const span=Math.max(1,Math.round((e.duration||60)/30));
      return {e, si, span, subCol:0, totalSubCols:1};
    });

    // Group overlapping entries and split into sub-columns
    placed.forEach((a,ai)=>{
      const overlaps=placed.filter((b,bi)=>bi!==ai&&b.si<a.si+a.span&&b.si+b.span>a.si);
      if(overlaps.length){
        const group=[a,...overlaps].sort((x,y)=>x.si-y.si);
        const total=group.length;
        group.forEach((item,idx)=>{item.subCol=idx;item.totalSubCols=total;});
      }
    });

    placed.forEach(({e,si,span,subCol,totalSubCols})=>{
      const cell=inner.querySelector(`[data-team="${ti}"][data-slot="${SLOTS[si]}"]`);
      if(!cell) return;
      const isTask=e._task;
      const typeKey=isTask?'task':(e.type||'install');
      const job=isTask?null:jobById[e.job_id];
      const ref=isTask?(e.title||'Task'):(job?job.job_ref||job.job_number:'—');
      const addr=job?job.address?.split(',')[0]||'':'';
      const lbl=isTask?'Task':{install:'Install',pickup:'Pickup',to_load:'To Load'}[e.type]||'';

      // Sub-column positioning
      const pct=100/totalSubCols;
      const left=subCol*pct;
      const width=pct;

      const tile=document.createElement('div');
      tile.className=`rs-tile ${typeKey}`;
      tile.style.cssText=`top:0;left:calc(${left}% + 2px);width:calc(${width}% - 4px);height:${span*SLOT_H-4}px;cursor:pointer;position:absolute;`;
      tile.innerHTML=`<div class="rs-tile-label">${lbl}</div><div class="rs-tile-ref">${ref}</div>${addr?`<div class="rs-tile-addr">${addr}</div>`:''} ${e.notes?`<div class="rs-tile-note">📝 ${e.notes}</div>`:''}`;
      tile.onclick=()=>openEntryPop(e.id,team.id,null);
      cell.style.position='relative';
      cell.appendChild(tile);
    });
  });
}

// Unscheduled tray — entries created by seed_two_day_schedule (day-only
// placement) sit here until the admin assigns a team, time & duration.
function renderTray(){
  const jobById=Object.fromEntries(dayJobs.map(j=>[j.id,j]));
  const teamIds=new Set(dayTeams.map(t=>t.id));
  const resolvesToTeam=e=>{
    if(e.team_id && teamIds.has(e.team_id)) return true;
    if(!e.team_id && e.vehicle && dayTeams.some(t=>t.vehicle===e.vehicle)) return true;
    return false;
  };
  // Two cases land in the tray: genuinely unplaced (no time yet), and
  // orphaned (had a time/vehicle from before this change but no longer
  // resolves to any existing team) — the latter should never happen going
  // forward since saveEntry now requires a team whenever a time is set,
  // but this catches any pre-existing data so nothing is silently lost.
  const unplaced=daySchedule.filter(e=>!e.start_time || !resolvesToTeam(e));
  const wrap=document.getElementById('rs-tray-wrap');
  const tray=document.getElementById('rs-tray');

  if(!unplaced.length){
    wrap.style.display='none';
    tray.innerHTML='';
    return;
  }

  wrap.style.display='block';
  tray.innerHTML=unplaced.map(e=>{
    const job=jobById[e.job_id];
    const ref=job?(job.job_ref||job.job_number):'—';
    const addr=job?.address||'';
    const typeCls=e.type||'install';
    const orphanFlag=(e.start_time && !resolvesToTeam(e))?' <span title="Had a time but no matching team — please reassign">⚠️</span>':'';
    return `<div class="rs-tray-tile ${typeCls}" onclick="openEntryPop('${e.id}',null,null)">
      <div class="rs-tray-tile-type">${TYPE_LBL[e.type]||e.type}${orphanFlag}</div>
      <div class="rs-tray-tile-ref">#${ref}</div>
      ${addr?`<div class="rs-tray-tile-addr">${addr}</div>`:''}
    </div>`;
  }).join('');
}

// ── Team popover ──
function openTeamPop(id){
  const team=id?dayTeams.find(t=>t.id===id):null;
  document.getElementById('team-pop-title').textContent=team?'Edit Team':'Add Team';
  document.getElementById('team-id').value=id||'';
  document.getElementById('team-name').value=team?.name||'';
  document.getElementById('team-del-btn').style.display=team?'inline-flex':'none';
  document.getElementById('save-tmpl').checked=false;
  _fn=team?.function||'transport';
  _vehicle=team?.vehicle||'';
  setFn(_fn,true);
  document.querySelectorAll('#vehicle-chips .chip').forEach(b=>{const v=b.getAttribute('onclick').match(/'([^']*)'/)[1];b.classList.toggle('selected',v===_vehicle);});
  const leadSel=document.getElementById('team-lead');
  leadSel.innerHTML='<option value="">— no lead —</option>'+ALL_WORKERS.map(w=>`<option${w===team?.lead?' selected':''}>${w}</option>`).join('');
  const sel=team?.members||[];
  document.getElementById('member-chips').innerHTML=ALL_WORKERS.map(w=>`<button class="chip${sel.includes(w)?' selected':''}" onclick="this.classList.toggle('selected')">${w}</button>`).join('');
  // Templates
  const tl=document.getElementById('tmpl-list');
  tl.innerHTML=templates.length?templates.map(t=>`<button class="chip" onclick="applyTmpl('${t.id}')">${t.name}</button>`).join(''):'<span style="font-size:0.8rem;color:var(--muted);">No templates yet</span>';
  document.getElementById('team-overlay').classList.add('open');
  document.getElementById('team-pop').classList.add('open');
}
function closeTeamPop(){document.getElementById('team-overlay').classList.remove('open');document.getElementById('team-pop').classList.remove('open');}

function setFn(fn,silent){
  _fn=fn;
  document.querySelectorAll('#fn-btns .fn-btn').forEach(b=>{
    const f=b.getAttribute('onclick').match(/'(\w+)'/)[1];
    b.className='fn-btn'+(f===fn?' active-'+fn:'');
  });
}
function pickVehicle(btn,v){_vehicle=v;document.querySelectorAll('#vehicle-chips .chip').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');}
function applyTmpl(id){
  const t=templates.find(x=>x.id===id);if(!t)return;
  document.getElementById('team-name').value=t.name||'';
  _fn=t.function||'transport';setFn(_fn,true);
  _vehicle=t.vehicle||'';
  document.querySelectorAll('#vehicle-chips .chip').forEach(b=>{const v=b.getAttribute('onclick').match(/'([^']*)'/)[1];b.classList.toggle('selected',v===_vehicle);});
  document.getElementById('team-lead').value=t.lead||'';
  document.querySelectorAll('#member-chips .chip').forEach(b=>b.classList.toggle('selected',(t.members||[]).includes(b.textContent)));
}
async function saveTeam(){
  const id=document.getElementById('team-id').value;
  const lead=document.getElementById('team-lead').value||null;
  const members=[...document.querySelectorAll('#member-chips .chip.selected')].map(b=>b.textContent);
  const name=document.getElementById('team-name').value.trim()||null;
  const p={name,vehicle:_vehicle||null,function:_fn,lead,members};
  if(id){await fetch(`/api/teams/entry/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});}
  else{const ds=localDate(viewDate);p.sort_order=dayTeams.length;await fetch(`/api/teams/${ds}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});}
  if(document.getElementById('save-tmpl').checked&&name){await fetch('/api/team-templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,vehicle:_vehicle||null,function:_fn,lead,members})});}
  closeTeamPop();load();
}
async function deleteTeam(){
  const id=document.getElementById('team-id').value;
  if(!id||!confirm('Delete this team? Entries will be unlinked.'))return;
  await fetch(`/api/teams/entry/${id}`,{method:'DELETE'});
  closeTeamPop();load();
}

// ── Entry popover ──
async function openEntryPop(entryId,teamId,slot){
  document.getElementById('entry-pop-title').textContent=entryId?'Edit Entry':'Add Entry';
  document.getElementById('entry-id').value=entryId||'';
  document.getElementById('entry-team-id').value=teamId||'';
  document.getElementById('entry-del-btn').style.display=entryId?'inline-flex':'none';
  document.getElementById('job-search').value='';
  document.getElementById('job-results').style.display='none';
  document.getElementById('job-selected').style.display='none';
  document.getElementById('job-id').value='';
  document.getElementById('task-title').value='';
  document.getElementById('entry-notes').value='';
  _jobId=null;

  // Team picker — only needed when opened without a column context (tray tiles)
  const teamPicker=document.getElementById('entry-team-picker');
  const teamSelect=document.getElementById('entry-team-select');
  if(!teamId){
    teamPicker.style.display='block';
    teamSelect.innerHTML='<option value="">Select a team…</option>'+
      dayTeams.map(t=>`<option value="${t.id}">${t.name||t.vehicle||'Team'} (${FN_LBL[t.function]||t.function})</option>`).join('');
    teamSelect.value='';
  }else{
    teamPicker.style.display='none';
  }

  const tSel=document.getElementById('entry-time');
  tSel.innerHTML='<option value="">No time</option>'+SLOTS.map(s=>`<option value="${s}">${fmtSlot(s)}</option>`).join('');
  if(slot)tSel.value=slot;
  document.getElementById('entry-dur').innerHTML='<option value="">—</option>'+DURS.map(d=>`<option value="${d}">${d>=60?d/60+'h'+(d%60?d%60+'m':''):d+'m'}</option>`).join('');
  document.querySelectorAll('#type-chips .chip').forEach((b,i)=>b.classList.toggle('selected',i===0));
  _type='install';
  if(entryId){
    const e=daySchedule.find(x=>x.id===entryId)||dayTasks.find(x=>x.id===entryId);
    if(e){
      const isTask=dayTasks.some(x=>x.id===entryId);
      setMode(isTask?'task':'job');
      if(isTask){
        document.getElementById('task-title').value=e.title||'';
      } else {
        _type=e.type||'install';
        document.querySelectorAll('#type-chips .chip').forEach(b=>{
          const t=b.getAttribute('onclick').match(/'([^']+)'/)[1];
          b.classList.toggle('selected',t===_type);
        });
        _jobId=e.job_id;
        document.getElementById('job-id').value=e.job_id||'';
        // Look up job in dayJobs first, fetch if missing
        let job=dayJobs.find(j=>j.id===e.job_id);
        if(job){
          document.getElementById('job-selected-label').textContent=`${job.job_ref||job.job_number} — ${job.address||''}`;
          document.getElementById('job-selected').style.display='flex';
        } else if(e.job_id){
          // Fetch the job directly — it may be on a different date
          try{
            const r=await fetch(`/api/jobs/${e.job_id}`);
            const d=await r.json();
            const j=d.job||d;
            if(j&&j.id){
              if(!dayJobs.find(x=>x.id===j.id)) dayJobs.push(j);
              document.getElementById('job-selected-label').textContent=`${j.job_ref||j.job_number} — ${j.address||''}`;
              document.getElementById('job-selected').style.display='flex';
            }
          }catch(err){}
        }
      }
      tSel.value=e.start_time||'';
      document.getElementById('entry-dur').value=e.duration||'';
      document.getElementById('entry-notes').value=e.notes||'';
    }
  }else{setMode('job');}
  document.getElementById('entry-overlay').classList.add('open');
  document.getElementById('entry-pop').classList.add('open');
}
function closeEntryPop(){document.getElementById('entry-overlay').classList.remove('open');document.getElementById('entry-pop').classList.remove('open');_jobId=null;}
function setMode(m){
  _mode=m;
  document.getElementById('job-fields').style.display=m==='job'?'block':'none';
  document.getElementById('task-fields').style.display=m==='task'?'block':'none';
  document.getElementById('mode-job').className='fn-btn'+(m==='job'?' active-transport':'');
  document.getElementById('mode-task').className='fn-btn'+(m==='task'?' active-transport':'');
}
function pickType(btn,t){_type=t;document.querySelectorAll('#type-chips .chip').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');}
function searchJobs(q){
  clearTimeout(_jsTimer);
  const res=document.getElementById('job-results');
  if(!q.trim()){res.style.display='none';return;}
  _jsTimer=setTimeout(async()=>{
    const r=await fetch('/api/jobs');const jobs=await r.json();
    const ql=q.toLowerCase();
    const m=jobs.filter(j=>(j.job_ref||'').toLowerCase().includes(ql)||(j.job_number||'').toLowerCase().includes(ql)||(j.address||'').toLowerCase().includes(ql)).slice(0,8);
    res.innerHTML=m.length?m.map(j=>`<div class="job-search-result" onclick="pickJob('${j.id}','${(j.job_ref||j.job_number||'').replace(/'/g,"\\'")}','${(j.address||'').replace(/'/g,"\\'")}')"><span class="jsr-ref">${j.job_ref||j.job_number}</span><span class="jsr-addr">${j.address||''}</span></div>`).join(''):'<div class="job-search-result" style="color:var(--muted)">No jobs found</div>';
    res.style.display='block';
  },300);
}
function pickJob(id,ref,addr){_jobId=id;document.getElementById('job-results').style.display='none';document.getElementById('job-selected-label').textContent=`${ref} — ${addr}`;document.getElementById('job-selected').style.display='flex';document.getElementById('job-id').value=id;document.getElementById('job-search').value='';}
function clearJob(){_jobId=null;document.getElementById('job-selected').style.display='none';document.getElementById('job-id').value='';}
// Shared fetch wrapper — surfaces server errors instead of failing silently.
// Returns {ok, data} — caller checks .ok before proceeding.
async function apiFetch(url, opts){
  let res, data;
  try{
    res = await fetch(url, opts);
  }catch(networkErr){
    alert('Network error — could not reach the server. Check your connection and try again.');
    return {ok:false, data:null};
  }
  try{
    data = await res.json();
  }catch(parseErr){
    data = null;
  }
  if(!res.ok || (data && data.success===false)){
    const msg = (data && data.error) ? data.error : `Save failed (HTTP ${res.status}).`;
    alert(`Could not save: ${msg}`);
    return {ok:false, data};
  }
  return {ok:true, data};
}

async function saveEntry(){
  const eid=document.getElementById('entry-id').value;
  const tid=document.getElementById('entry-team-id').value;
  const time=document.getElementById('entry-time').value||null;
  const dur=parseInt(document.getElementById('entry-dur').value)||null;
  const notes=document.getElementById('entry-notes').value.trim()||null;
  const team=dayTeams.find(t=>t.id===tid);
  const ds=localDate(viewDate);
  // A time without a team would vanish from both the grid and the tray —
  // require a team the moment a time is set.
  if(time && !tid){alert('Please select a team before setting a time.');return;}
  if(_mode==='job'){
    const jid=_jobId||document.getElementById('job-id').value;
    if(!jid){alert('Please select a job.');return;}
    const p={job_id:jid,date:ds,team_id:tid||null,vehicle:team?.vehicle||null,type:_type,category:team?.function||'transport',start_time:time,duration:dur,notes};
    const result = eid
      ? await apiFetch(`/api/schedule/${eid}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
      : await apiFetch(`/api/schedule-entry`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
    if(!result.ok) return; // keep popover open so the user can fix and retry
  }else{
    const title=document.getElementById('task-title').value.trim();
    if(!title){alert('Please enter a description.');return;}
    const result = eid
      ? await apiFetch(`/api/tasks/${eid}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,start_time:time,duration:dur,notes,team_id:tid})})
      : await apiFetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,date:ds,start_time:time,duration:dur,notes,team_id:tid,vehicle:team?.vehicle||'ALL',category:team?.function||'warehouse'})});
    if(!result.ok) return;
  }
  closeEntryPop();load();
}
async function deleteEntry(){
  const eid=document.getElementById('entry-id').value;
  if(!eid||!confirm('Delete this entry?'))return;
  const isTask=dayTasks.some(t=>t.id===eid);
  const result = isTask
    ? await apiFetch(`/api/tasks/${eid}`,{method:'DELETE'})
    : await apiFetch(`/api/schedule/${eid}`,{method:'DELETE'});
  if(!result.ok) return;
  closeEntryPop();load();
}

load();
</script>
