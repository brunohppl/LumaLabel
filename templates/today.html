<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Day · LUMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#1a1714;--accent:#b8935a;--green:#4a7c59;--red:#e85c47;--blue:#2e5a8a;--purple:#6a3d8a;--muted:#9a8f80;--border:#e0d8ce;--sand:#f0ebe4;--warm:#faf8f4;}
body{background:var(--warm);color:var(--ink);font-family:'Jost',sans-serif;min-height:100vh;}

/* HERO */
.hero{position:relative;background:var(--ink);padding:24px 20px 20px;text-align:center;}
.hero-logo{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;letter-spacing:0.14em;color:#faf8f4;}
.hero-logo em{font-style:italic;color:var(--accent);}
.hero-home{position:absolute;left:16px;top:14px;color:rgba(250,248,244,0.65);
  text-decoration:none;font-size:0.78rem;letter-spacing:0.06em;}
.hero-home:hover{color:#fff;}
.hero-date{font-size:0.82rem;color:rgba(250,248,244,0.4);margin-top:6px;letter-spacing:0.06em;}

.page{max-width:600px;margin:0 auto;padding:20px 16px 60px;}

/* NAME PICKER */

/* DATE NAV */
.date-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.date-nav{background:none;border:1px solid var(--border);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:1rem;color:var(--ink);}
.date-nav:hover{background:var(--sand);}
.date-lbl{flex:1;text-align:center;font-size:0.88rem;font-weight:600;color:var(--ink);}
.btn-today{padding:6px 14px;background:var(--accent);color:white;border:none;border-radius:4px;font-family:'Jost',sans-serif;font-size:0.78rem;font-weight:600;cursor:pointer;}

/* TEAM BADGE */
.team-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:6px;margin-bottom:16px;font-size:0.82rem;font-weight:600;color:white;}

/* CARDS */
.card{background:white;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;border-left:4px solid transparent;}
.card.install{border-left-color:var(--green);}
.card.pickup{border-left-color:var(--blue);}
.card.to_load{border-left-color:var(--accent);}
.card.task{border-left-color:var(--muted);}
.card.styling{border-left-color:var(--purple);}
.card-time{text-align:center;min-width:48px;flex-shrink:0;}
.card-time-h{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;line-height:1;color:var(--ink);}
.card-time-ampm{font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.card-body{flex:1;}
.card-type{font-size:0.65rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:3px;color:var(--muted);}
.card-ref{font-size:1rem;font-weight:600;color:var(--ink);margin-bottom:2px;}
.card-addr{font-size:0.85rem;color:var(--muted);margin-bottom:2px;}
.card-loaded{
  margin-top:6px;padding:7px 10px;border-radius:8px;
  background:rgba(31,75,44,0.10);border-left:3px solid #2E7D32;
  font-size:0.86rem;color:#1F4B2C;
}
.card-loaded strong{text-transform:uppercase;letter-spacing:0.04em;font-size:0.72rem;margin-right:2px;}
.card-transfer{
  margin-top:6px;padding:7px 10px;border-radius:8px;
  background:rgba(122,74,0,0.10);border-left:3px solid #B07A2A;
  font-size:0.82rem;color:#5C4318;
}
.card-transfer strong{text-transform:uppercase;letter-spacing:0.04em;font-size:0.72rem;}
.card-prop{font-size:0.78rem;color:var(--muted);font-style:italic;margin-bottom:8px;opacity:0.9;}
.card-access{
  margin-top:8px;padding:8px 10px;border-radius:8px;
  background:rgba(201,162,39,0.14);border-left:3px solid #C9A227;
  font-size:0.86rem;line-height:1.35;color:#3A3128;
}
.card-access strong{text-transform:uppercase;letter-spacing:0.04em;font-size:0.72rem;margin-right:4px;}
.card-note{font-size:0.8rem;color:var(--muted);font-style:italic;margin-bottom:8px;}
.card-btns{display:flex;gap:8px;flex-wrap:wrap;}
.card-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:6px;font-family:'Jost',sans-serif;font-size:0.78rem;font-weight:600;cursor:pointer;text-decoration:none;border:none;}
.card-btn-nav{background:var(--accent);color:white;}
.card-btn-stylist{background:rgba(74,124,89,0.1);color:var(--green);}
.card-btn-driver{background:rgba(46,90,138,0.1);color:var(--blue);}
.empty{text-align:center;padding:48px 20px;}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--ink);margin-bottom:6px;}
.empty-sub{font-size:0.85rem;color:var(--muted);}
.loading{text-align:center;padding:40px;color:var(--muted);}
.nav-back{display:inline-flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--muted);text-decoration:none;margin-bottom:16px;}
.nav-back:hover{color:var(--accent);}

/* Team columns — full day view */
.team-cols{display:flex;gap:12px;overflow-x:auto;padding-bottom:20px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
.team-cols::-webkit-scrollbar{height:4px;}
.team-cols::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.team-col{flex:0 0 85vw;max-width:340px;scroll-snap-align:start;display:flex;flex-direction:column;}
@media(min-width:640px){.team-col{flex:0 0 300px;}}
.team-col-hdr{border-radius:10px 10px 0 0;padding:12px 14px;}
.team-col-fn{font-size:0.6rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.65);margin-bottom:2px;}
.team-col-name{font-size:1rem;font-weight:700;color:white;}
.team-col-sub{font-size:0.72rem;color:rgba(255,255,255,0.6);margin-top:2px;}
.team-col-lead{font-size:0.74rem;color:rgba(255,255,255,0.9);font-weight:600;margin-top:2px;}
.team-col-cards{background:rgba(0,0,0,0.03);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:10px;flex:1;}
.scroll-hint{text-align:center;font-size:0.75rem;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px;}
@media(min-width:640px){.scroll-hint{display:none;}}
.slack-overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,0.55);z-index:400;align-items:center;justify-content:center;padding:24px;}
.slack-overlay.open{display:flex;}
.slack-sheet{background:white;border-radius:10px;padding:24px;max-width:320px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.2);}
.slack-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;margin-bottom:8px;}
.slack-sub{font-size:0.85rem;color:var(--muted);margin-bottom:18px;line-height:1.4;}
.slack-btns{display:flex;flex-direction:column;gap:8px;}
.slack-btn{width:100%;padding:12px;border-radius:6px;font-family:'Jost',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;border:none;}
.slack-btn-yes{background:var(--accent);color:white;}
.slack-btn-no{background:white;color:var(--ink);border:1px solid var(--border);}
.slack-btn-cancel{background:none;color:var(--muted);font-size:0.82rem;}
</style>
</head>
<body>

<div class="hero">
  <a href="/" class="hero-home">← Home</a>
  <div class="hero-logo">LUMA <em>Design</em> Co</div>
  <div class="hero-date" id="hero-date"></div>
</div>

<!-- Slack popup -->
<div class="slack-overlay" id="slack-overlay">
  <div class="slack-sheet">
    <div style="font-size:1.8rem;margin-bottom:8px;">📍</div>
    <div class="slack-title">Notify Slack?</div>
    <div class="slack-sub">Send an ETA to Slack before opening Maps?</div>
    <div class="slack-btns">
      <button class="slack-btn slack-btn-yes" onclick="slackChoice('yes')">Yes — notify Slack</button>
      <button class="slack-btn slack-btn-no"  onclick="slackChoice('no')">No — just open Maps</button>
      <button class="slack-btn slack-btn-cancel" onclick="slackChoice('cancel')">Cancel</button>
    </div>
  </div>
</div>

<div class="page">
  <a href="/scheduler" class="nav-back">⚙ Scheduler (Admin)</a>

  <!-- Date nav -->
  <div class="date-row">
    <button class="date-nav" onclick="shiftDate(-1)">‹</button>
    <div class="date-lbl" id="date-lbl"></div>
    <button class="date-nav" onclick="shiftDate(1)">›</button>
    <button class="btn-today" onclick="goToday()">Today</button>
  </div>

  <div class="scroll-hint" id="scroll-hint" style="display:none;">← swipe to see more teams →</div>
  <div id="day-content"><div class="loading">Loading…</div></div>
</div>

<script>
// A task belongs to exactly ONE team. It used to be matched inline, and the
// 'ALL' test made a task with no team match every crew that had a vehicle —
// so Warehouse tasks (saved as 'ALL', because that column has no vehicle)
// appeared under every crew except Warehouse itself.
function resolveTaskTeam(t, teams){
  if(t.team_id) return t.team_id;
  if(t.vehicle && t.vehicle!=='ALL'){
    const m=teams.find(x=>x.vehicle===t.vehicle);
    if(m) return m.id;
  }
  // Legacy whole-team task with nothing to place it by: show it once, on the
  // first crew, rather than on all of them or on none.
  if(t.vehicle==='ALL') return teams[0]?.id;
  return null;
}

const ALL_WORKERS=['Addy','Montie','Delphine','India','Hayley','Jo','Savio','Nick','Ayoub','Bruno','Phil','Thiago','Max'];
const SLOTS=[];for(let h=7;h<=15;h++)for(let m=0;m<60;m+=30){if(h===15&&m>30)break;SLOTS.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);}
const SLOT_H=44;
function slotIdx(t){if(!t)return 0;const[h,m]=t.split(':').map(Number);return Math.max(0,(h-7)*2+Math.floor(m/30));}
function fmtSlot(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return`${h%12||12}:${String(m).padStart(2,'0')}${h<12?'am':'pm'}`;}

const FN_COL={transport:'#2e5a8a',styling:'#6a3d8a',warehouse:'#b8935a'};
const FN_LBL={transport:'🚛 Transport',styling:'🎨 Styling',warehouse:'🏭 Warehouse'};
const TYPE_LBL={install:'Install',pickup:'Pickup',to_load:'To Load',task:'Task',styling:'Styling'};

let viewDate=new Date();
let dayData={teams:[],schedule:[],tasks:[],jobs:[]};
let _pendingNav=null;

function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDate(d){return d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});}
function fmtTime(t){if(!t)return{h:'—',ampm:''};const[h,m]=t.split(':').map(Number);return{h:`${h%12||12}:${String(m).padStart(2,'0')}`,ampm:h<12?'am':'pm'};}

// The name filter was removed — this view always shows the whole day.

function shiftDate(n){viewDate=new Date(viewDate);viewDate.setDate(viewDate.getDate()+n);load();}
function goToday(){viewDate=new Date();load();}

async function load(){
  const ds=localDate(viewDate);
  document.getElementById('date-lbl').textContent=fmtDate(viewDate);
  document.getElementById('hero-date').textContent=fmtDate(viewDate);
  document.getElementById('day-content').innerHTML='<div class="loading">Loading…</div>';
  try{
    const res=await fetch(`/api/runsheet/${ds}`);
    dayData=await res.json();
    renderDay();
  }catch(e){document.getElementById('day-content').innerHTML='<div class="loading">Failed to load.</div>';}
}

function renderDay(){
  const name='';   // no per-person filter; the full day is always shown
  const content=document.getElementById('day-content');

  const teams=dayData.teams||[];
  const schedule=dayData.schedule||[];
  const tasks=dayData.tasks||[];
  const jobs=dayData.jobs||[];
  const jobById=Object.fromEntries(jobs.map(j=>[j.id,j]));

  // Full day view — card columns per team, swipeable on mobile
  if(!name){
    if(!teams.length){
      content.innerHTML='<div class="empty"><div class="empty-title">Nothing scheduled</div><div class="empty-sub">No teams set up for this day yet.</div></div>';
      return;
    }
    let html=`<div class="team-cols">`;
    teams.forEach(team=>{
      const col=FN_COL[team.function]||'#1a1714';
      const others=(team.members||[]).filter(m=>m!==team.lead).join(', ');
      const teamEntries=[
        ...schedule.filter(e=>e.team_id===team.id||(!e.team_id&&team.vehicle&&e.vehicle===team.vehicle)).map(e=>({...e,_team:team,_isTask:false})),
        ...tasks.filter(t=>resolveTaskTeam(t,teams)===team.id).map(t=>({...t,_team:team,_isTask:true})),
      ].sort((a,b)=>(a.start_time||'99:99').localeCompare(b.start_time||'99:99'));

      html+=`<div class="team-col">
        <div class="team-col-hdr" style="background:${col};">
          <div class="team-col-fn">${FN_LBL[team.function]||team.function}</div>
          <div class="team-col-name">${team.name||team.vehicle||'Team'}</div>
          ${team.vehicle?`<div class="team-col-sub">Vehicle: ${team.vehicle}</div>`:''}
          ${team.lead?`<div class="team-col-lead">Lead: ${team.lead}</div>`:''}
          ${others?`<div class="team-col-sub">${others}</div>`:''}
        </div>
        <div class="team-col-cards">
          ${teamEntries.length
            ? teamEntries.map(e=>cardHTML(e,jobById,false)).join('')
            : '<div style="font-size:0.82rem;color:var(--muted);padding:16px 4px;">Nothing scheduled.</div>'
          }
        </div>
      </div>`;
    });
    html+=`</div>`;
    content.innerHTML=html;
    document.getElementById('scroll-hint').style.display='flex';
    return;
  }
  document.getElementById('scroll-hint').style.display='none';

  // Personal view — filter to teams this person is on
  const myTeams=teams.filter(t=>t.lead===name||(t.members||[]).includes(name));
  if(!myTeams.length){
    content.innerHTML=`<div class="empty"><div class="empty-title">Not assigned to a team today</div><div class="empty-sub">Ask your manager to add you to a team on the scheduler.</div></div>`;
    return;
  }

  const combined=[];
  myTeams.forEach(team=>{
    schedule.filter(e=>e.team_id===team.id||(!e.team_id&&team.vehicle&&e.vehicle===team.vehicle)).forEach(e=>{combined.push({...e,_team:team,_isTask:false});});
    tasks.filter(t=>resolveTaskTeam(t,myTeams)===team.id).forEach(t=>{combined.push({...t,_team:team,_isTask:true});});
  });
  combined.sort((a,b)=>(a.start_time||'99:99').localeCompare(b.start_time||'99:99'));

  if(!combined.length){
    const teamNames=myTeams.map(t=>t.name||t.vehicle||'your team').join(' & ');
    content.innerHTML=`<div class="empty"><div class="empty-title">Nothing scheduled yet</div><div class="empty-sub">You're on ${teamNames} — check back once the schedule is filled in.</div></div>`;
    return;
  }

  let html='';
  myTeams.forEach(t=>{
    const col=FN_COL[t.function]||'#1a1714';
    const others=(t.members||[]).filter(m=>m!==t.lead).join(', ');
    html+=`<div class="team-badge" style="background:${col};">${FN_LBL[t.function]||t.function} · ${t.name||t.vehicle||'Team'}${t.lead?` · Lead: ${t.lead}`:''}${others?` · ${others}`:''}</div><br/>`;
  });
  html+=combined.map(e=>cardHTML(e,jobById,false)).join('');
  content.innerHTML=html;
}

// Which way the stock is moving, and which job it pairs with. Only the
// receiving job stores the link, so the sending job is found by reverse lookup.
// 90 minutes reads as "1.5h", not "1.5h30m" — the old inline version divided
// by 60 without flooring and then appended the remainder as well.
function fmtDuration(mins){
  if(!mins) return '';
  if(mins < 60) return mins + 'm';
  if(mins % 60 === 0) return (mins / 60) + 'h';
  return (mins / 60).toFixed(1).replace(/\.0$/, '') + 'h';
}

// Which truck the stock is on. A styling crew arriving on site needs to know
// which vehicle to expect, and they aren't the ones who loaded it.
function loadedLine(job){
  if(!job) return '';
  const loads=(dayData.loads||[]).filter(l=>l.job_id===job.id && l.vehicle);
  if(!loads.length) return '';
  const seen=[];
  loads.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))
       .forEach(l=>{ if(!seen.includes(l.vehicle)) seen.push(l.vehicle); });
  return `<div class="card-loaded">📦 <strong>On</strong> ${seen.join(' + ')}</div>`;
}

function transferLine(job, jobById){
  if(!job) return '';
  const all=Object.values(jobById||{});
  const refOf=j=>j?(j.job_ref||('#'+String(j.job_number||'').slice(-3))):'';
  if(job.is_transfer && job.transfer_from_job_id){
    const src=jobById[job.transfer_from_job_id];
    const who=src?` ${refOf(src)}`:' another job';
    return `<div class="card-transfer">⇄ <strong>Transfer from</strong>${who}</div>`;
  }
  const dest=all.find(j=>j.is_transfer && j.transfer_from_job_id===job.id);
  if(dest){
    return `<div class="card-transfer">⇄ <strong>Transfer to</strong> ${refOf(dest)}</div>`;
  }
  return '';
}

function cardHTML(e, jobById, showTeam){
  // Property type / size / style, same as the jobs page and the scheduler tiles.
  // Breaks and standalone tasks have no property, so nothing shows.
  const _pj = jobById[e.job_id];
  const propTag = (_pj && !(e.kind==='break'||e.title==='Lunch break'))
    ? [_pj.property_type, _pj.property_size, _pj.property_style].filter(Boolean).join(' — ')
    : '';
  const isTask=!!(e._isTask||(e.title&&!e.job_id));
  const typeKey=isTask?'task':(e.type||'install');
  const job=isTask?null:jobById[e.job_id];
  const ref=isTask?(e.title||'Task'):(job?job.job_ref||job.job_number:'—');
  const addr=job?job.address||'':'';
  const street=addr.split(',')[0];
  const{h,ampm}=fmtTime(e.start_time);
  const dur=e.duration?` · ${fmtDuration(e.duration)}`:'';
  const typeLabel=TYPE_LBL[typeKey]||typeKey;
  const teamLabel=showTeam&&e._team?`<div style="font-size:0.68rem;color:var(--muted);margin-bottom:4px;">${e._team.name||e._team.vehicle||''}</div>`:'';
  return `<div class="card ${typeKey}">
    <div class="card-time">
      <div class="card-time-h">${h}</div>
      <div class="card-time-ampm">${ampm}</div>
    </div>
    <div class="card-body">
      ${teamLabel}
      <div class="card-type">${typeLabel}${dur}</div>
      <div class="card-ref">${ref}</div>
      ${street?`<div class="card-addr">${street}</div>`:''}
      ${propTag?`<div class="card-prop">${propTag}</div>`:''}
      ${(e.type==='install')?loadedLine(_pj):''}
      ${transferLine(_pj, jobById)}
      ${(e.kind==='break'||e.title==='Lunch break')?'':(job&&job.access_notes?`<div class="card-access">🔑 <strong>Access</strong> ${job.access_notes}</div>`:'')}
      ${e.notes?`<div class="card-note">📝 ${e.notes}</div>`:''}
      ${job?`<div class="card-btns">
        <button class="card-btn card-btn-nav" onclick="navigate('${job.id}','${addr.replace(/'/g,"\\'")}','${e._team?.function||''}')">📍 Navigate</button>
        ${e._team?.function==='styling'?`<a href="/stylist/${job.id}" target="_blank" class="card-btn card-btn-stylist">✎ Stylist</a>`:''}
        ${e._team?.function!=='styling'?`<a href="/driver/${job.id}" target="_blank" class="card-btn card-btn-driver">🚛 Driver</a>`:''}
      </div>`:''}
    </div>
  </div>`;
}

// Navigate with Slack confirm
function navigate(jobId, addr, teamFunction){
  // The endpoint files the ETA against the truck or the stylist, and words the
  // Slack message accordingly. This page used to send role:'team', which isn't
  // a value it accepts — so the request was rejected and nothing reached Slack.
  _pendingNav={jobId,addr,role:(teamFunction==='styling'?'stylist':'truck')};
  document.getElementById('slack-overlay').classList.add('open');
}
function slackChoice(choice){
  document.getElementById('slack-overlay').classList.remove('open');
  const{jobId,addr,role}=_pendingNav||{};
  _pendingNav=null;
  if(choice==='cancel') return;
  const mapsUrl=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr||'')}`;
  if(choice==='no'){window.open(mapsUrl,'_blank');return;}
  if(!navigator.geolocation){window.open(mapsUrl,'_blank');return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      fetch(`/api/jobs/${jobId}/eta`,{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({lat:pos.coords.latitude,lng:pos.coords.longitude,role:role||'truck'})})
        .then(async res=>{
          // Maps opens either way, so a rejected request used to look exactly
          // like a successful one. At least say so in the console.
          if(!res.ok) console.warn('ETA/Slack post failed:', res.status, await res.text().catch(()=>''));
          window.open(mapsUrl,'_blank');
        })
        .catch(err=>{ console.warn('ETA/Slack post failed:', err); window.open(mapsUrl,'_blank'); });
    },
    ()=>window.open(mapsUrl,'_blank'),
    {timeout:8000}
  );
}

load();
</script>
</body>
</html>
