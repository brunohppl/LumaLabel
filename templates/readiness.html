<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Readiness · LUMA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1A1714;--muted:#9A8F80;--border:#D8CFBF;--warm:#F2EDE4;--cream:#FAF8F4;
  --accent:#B8935A;--green:#4A7C59;--red:#A63D2F;--amber:#C88A2E;--sand:#EDE7DC;
  --ontrack:#8D8577;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--warm);color:var(--ink);font-family:'Jost',sans-serif;
  display:flex;flex-direction:column;}

/* Thin header — every pixel below belongs to the board */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:6px 12px;background:var(--ink);}
.bar img{height:22px;width:auto;}
.bar-title{font-family:'Cormorant Garamond',serif;font-size:0.95rem;color:var(--cream);
  letter-spacing:0.05em;}
.legend{display:flex;gap:10px;margin-left:auto;align-items:center;}
.lg{display:flex;align-items:center;gap:4px;font-size:0.6rem;letter-spacing:0.07em;
  text-transform:uppercase;color:rgba(250,248,244,0.6);}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.fs{background:transparent;border:1px solid rgba(250,248,244,0.28);color:rgba(250,248,244,0.75);
  font-family:'Jost',sans-serif;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:3px;cursor:pointer;}
.fs:hover{border-color:var(--accent);color:var(--accent);}

/* ── The matrix: crews down, three days across, no scrolling ── */
.grid{flex:1 1 auto;display:grid;grid-template-columns:var(--headw) repeat(3,1fr);
  grid-auto-rows:minmax(0,1fr);min-height:0;--headw:132px;overflow:auto;}
.hcell{background:var(--sand);border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);padding:5px 9px;display:flex;
  flex-direction:column;justify-content:center;}
.hcell.corner{border-right:1px solid var(--border);}
.hday{font-size:0.78rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;}
.hdate{font-size:0.64rem;color:var(--muted);}
.hlate{font-size:0.64rem;font-weight:700;color:var(--red);letter-spacing:0.04em;}

.rowhead{background:var(--warm);border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);padding:4px 9px;display:flex;
  flex-direction:column;justify-content:center;}
.crew{font-size:0.8rem;font-weight:600;line-height:1.15;}
.crew-sub{font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}

.cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:4px;display:flex;flex-direction:column;gap:4px;
  overflow:hidden;background:#fff;}
.cell.quiet{background:rgba(255,255,255,0.45);}

/* A chip per piece of work. Colour is readiness — what needs rescuing. */
/* Each chip takes an equal share of the cell's height, so one job fills the
   cell and the type reads from across the room. */
.chip{position:relative;flex:1 1 auto;min-height:34px;border-radius:4px;padding:6px 9px;
  color:#fff;line-height:1.15;overflow:hidden;display:flex;flex-direction:column;
  justify-content:center;}
/* With more than one piece of work in a cell, everything scales down rather
   than the second chip being squeezed out of sight. */
.cell.multi .chip{padding:4px 7px;min-height:28px;}
.cell.multi .chip-ref{font-size:clamp(0.95rem,2.2vh,1.6rem);}
.cell.multi .chip-status{font-size:clamp(0.6rem,1.1vh,0.8rem);}
.cell.multi .chip-kind{font-size:clamp(0.5rem,0.85vh,0.66rem);}
.cell.multi .bang{width:14px;height:14px;line-height:14px;font-size:0.62rem;top:4px;right:5px;}
.chip.late{background:var(--red);}
.chip.due{background:var(--amber);}
.chip.ok{background:var(--ontrack);}
.chip.done{background:var(--green);}
/* The action first and largest — Install or To Load is the thing to read */
/* The job number carries the tile — readable from across the room */
.chip-ref{font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:clamp(1.3rem,3.6vh,2.9rem);line-height:1;letter-spacing:0.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Where the job has actually got to */
.chip-status{font-size:clamp(0.68rem,1.5vh,1.1rem);font-weight:600;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
/* Which kind of day this is — quiet, in the corner */
.chip-kind{font-size:clamp(0.55rem,1vh,0.74rem);letter-spacing:0.1em;text-transform:uppercase;
  opacity:0.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto;}
/* Same corner on every tile, so it never shifts the number sideways */
.bang{position:absolute;top:6px;right:8px;width:17px;height:17px;border-radius:50%;
  background:#fff;color:var(--red);font-size:0.74rem;font-weight:700;text-align:center;
  line-height:17px;}
.kind{opacity:0.75;font-weight:500;}
.msg{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1;}

/* Denser when there are many crews, so it still fits one screen */
body.tight .crew{font-size:0.72rem;}
body.tight .chip{padding:3px 6px;}
body.tight .chip-ref{font-size:clamp(1.05rem,2.6vh,2rem);}
body.tight .chip-status{font-size:clamp(0.6rem,1.2vh,0.85rem);}
</style>
</head>
<body>

<div class="bar">
  <img src="/static/luma-mark-light.png" alt="LUMA"/>
  <span class="bar-title">Readiness</span>
  <div class="legend">
    <span class="lg"><i style="background:#A63D2F"></i>Behind</span>
    <span class="lg"><i style="background:#C88A2E"></i>Due</span>
    <span class="lg"><i style="background:#8D8577"></i>On track</span>
    <span class="lg"><i style="background:#4A7C59"></i>Ready</span>
    <button class="fs" id="fs-btn" onclick="toggleFull()">Full screen</button>
  </div>
</div>

<div class="grid" id="grid"><div class="msg">Loading…</div></div>

<script>
const DAY_LABEL=['Today','Tomorrow','Day after'];
// Wording matches the rest of the app, not a third set of names
const KIND={install:'Install',to_load:'To Load',bay:'Load Bay'};
let DATA={days:[],jobs:[],teams:[],rules:{}};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const street=a=>String(a||'').split(',')[0].trim();
function shortDate(iso){
  try{ return new Date(iso+'T00:00:00')
    .toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
  catch(e){ return iso; }
}


function chipHTML(j){
  // Detail stays in the tooltip; the tile itself says the job and where it's got to.
  const detail=(j.stages||[]).map(s=>
    `${s.name}: ${s.total?`${s.done}/${s.total}`:'—'}${s.note?' ('+s.note+')':''}`).join('\n');
  const needs=j.met?'':` · needs ${j.needs}`;
  return `<div class="chip ${j.worst}"
      title="${esc(j.ref)} · ${esc(KIND[j.kind]||j.kind)}\n${esc(street(j.address))}${j.install_date?'\nInstalls '+esc(shortDate(j.install_date)):''}\nStatus: ${esc(j.status_label||'')}${esc(needs)}\n${esc(detail)}">
    ${j.worst==='late'?'<span class="bang">!</span>':''}
    <div class="chip-ref">${esc(j.ref)}</div>
    <div class="chip-status">${esc(j.status_label||'')}</div>
    <div class="chip-kind">${esc(KIND[j.kind]||j.kind)}</div>
  </div>`;
}

function render(){
  const grid=document.getElementById('grid');
  const days=DATA.days||[];

  // Crews come from day_teams per date, so the same crew is a different row
  // each day. Key rows by name so one crew is one line across all three days.
  // Styling crews don't pick, stage or load — nothing on this board applies
  // to them, so their rows were only taking up height.
  const relevant=(DATA.teams||[]).filter(t=>(t.function||'')!=='styling');

  // Row order follows the runsheet's column order, so the board reads the
  // same way round as the page the scheduler actually works in.
  const order={}, rowKeys=[], seen=new Set();
  relevant.forEach(t=>{
    const k=(t.name||t.vehicle||'Team');
    const so=(t.sort_order===undefined||t.sort_order===null)?999:t.sort_order;
    order[k]=Math.min(order[k]===undefined?999:order[k], so);
    if(!seen.has(k)){ seen.add(k); rowKeys.push({key:k,fn:t.function||''}); }
  });
  rowKeys.sort((a,b)=>(order[a.key]-order[b.key]) || a.key.localeCompare(b.key));

  // Resolve a job to its crew exactly as the runsheet does: by team_id, and
  // by vehicle for rows saved before team_id existed. Matching on team_id
  // alone put those older tiles under "Unassigned" here while the runsheet
  // showed them on a crew.
  const teamIdToKey={}, vehToKeyByDay={};
  relevant.forEach(t=>{
    const k=(t.name||t.vehicle||'Team');
    teamIdToKey[t.id]=k;
    if(t.vehicle) (vehToKeyByDay[t.date]=vehToKeyByDay[t.date]||{})[t.vehicle]=k;
  });
  // A styling crew's id maps to nothing, so its work would fall into
  // "Unassigned" — drop it instead.
  const stylingIds=new Set((DATA.teams||[])
    .filter(t=>(t.function||'')==='styling').map(t=>t.id));

  const cell={};   // key|date -> rows
  (DATA.jobs||[]).forEach(j=>{
    if(stylingIds.has(j.team_id)) return;
    const k = teamIdToKey[j.team_id]
           || (!j.team_id && j.vehicle ? (vehToKeyByDay[j.date]||{})[j.vehicle] : null);
    if(!k) return;               // in the tray on the runsheet — not a column
    (cell[k+'|'+j.date]=cell[k+'|'+j.date]||[]).push(j);
  });
  // Work with no crew lives in the runsheet's tray, not in a column — so it
  // doesn't get a row here either. The board mirrors the runsheet's columns.


  const onBoard=j=>!stylingIds.has(j.team_id) && !!(teamIdToKey[j.team_id]
                   || (!j.team_id && j.vehicle ? (vehToKeyByDay[j.date]||{})[j.vehicle] : null));
  const lateOn=d=>(DATA.jobs||[]).filter(j=>j.date===d && j.worst==='late' && onBoard(j)).length;

  let html=`<div class="hcell corner"></div>`;
  days.forEach((d,i)=>{
    const n=lateOn(d);
    html+=`<div class="hcell">
      <div class="hday">${DAY_LABEL[i]||''}</div>
      <div class="hdate">${shortDate(d)}</div>
      ${n?`<div class="hlate">${n} need rescuing</div>`:''}
    </div>`;
  });

  rowKeys.forEach(r=>{
    html+=`<div class="rowhead">
      <div class="crew">${esc(r.key)}</div>
      <div class="crew-sub">${esc(r.fn)}</div>
    </div>`;
    days.forEach(d=>{
      const rows=cell[r.key+'|'+d]||[];
      const cls=(rows.length?'':'quiet')+(rows.length>1?' multi':'');
      html+=`<div class="cell ${cls}">${rows.map(chipHTML).join('')}</div>`;
    });
  });

  grid.innerHTML=html||'<div class="msg">Nothing scheduled</div>';
  // Shrink the type when there are many crews, so it still fits one screen
  document.body.classList.toggle('tight', rowKeys.length>7);
}

function toggleFull(){
  const el=document.documentElement;
  try{
    if(!document.fullscreenElement){
      (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document);
    }
  }catch(e){ /* unsupported — the board still works */ }
}
document.addEventListener('fullscreenchange',()=>{
  const b=document.getElementById('fs-btn');
  if(b) b.textContent=document.fullscreenElement?'Exit full screen':'Full screen';
});

async function load(){
  try{
    const res=await fetch('/api/readiness');
    DATA=await res.json();
    if(DATA && DATA.error){
      document.getElementById('grid').innerHTML=
        '<div class="msg">Could not build the board.<br><code style="font-size:0.7rem">'+
        String(DATA.error).replace(/[<>]/g,'')+'</code></div>';
      return;
    }
    render();
  }catch(e){
    document.getElementById('grid').innerHTML=
      '<div class="msg">Could not load. Check the connection and try again.</div>';
  }
}
load();
setInterval(load,120000);   // left on a screen, never touched
</script>
</body>
</html>
