<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Readiness · LUMA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1A1714;--muted:#9A8F80;--border:#D8CFBF;--warm:#F2EDE4;--cream:#FAF8F4;
  --accent:#B8935A;--green:#4A7C59;--red:#A63D2F;--amber:#C88A2E;--sand:#EDE7DC;
  --ontrack:#8D8577;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--warm);color:var(--ink);font-family:'Jost',sans-serif;
  display:flex;flex-direction:column;overflow:hidden;}

/* Thin header — the grid is what matters */
.bar{display:flex;align-items:center;gap:14px;padding:7px 14px;background:var(--ink);flex:0 0 auto;}
.bar img{height:24px;width:auto;}
.bar-title{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--cream);letter-spacing:0.05em;}
.legend{display:flex;gap:11px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.lg{display:flex;align-items:center;gap:5px;font-size:0.62rem;letter-spacing:0.08em;
  text-transform:uppercase;color:rgba(250,248,244,0.6);}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block;}
.fs{background:transparent;border:1px solid rgba(250,248,244,0.28);color:rgba(250,248,244,0.75);
  font-family:'Jost',sans-serif;font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;
  padding:5px 11px;border-radius:3px;cursor:pointer;}
.fs:hover{border-color:var(--accent);color:var(--accent);}

/* Three days split the height evenly — no filler */
.days{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
.day{flex:1 1 0;display:flex;flex-direction:column;min-height:0;border-top:2px solid var(--border);}
.day:first-child{border-top:none;}
.day-hdr{flex:0 0 auto;display:flex;align-items:baseline;gap:10px;padding:3px 12px;background:var(--sand);}
.day-name{font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;}
.day-date{font-size:0.66rem;color:var(--muted);}
.day-late{margin-left:auto;font-size:0.66rem;font-weight:700;color:var(--red);letter-spacing:0.06em;}
.day-body{flex:1 1 auto;overflow:auto;}

/* Crew rows and a time axis — the day view's shape */
.rowline{display:flex;border-bottom:1px solid rgba(216,207,191,0.55);min-height:32px;}
.rowline:last-child{border-bottom:none;}
.rowhead{position:sticky;left:0;z-index:3;flex:0 0 106px;background:var(--warm);
  border-right:1px solid var(--border);padding:4px 7px;}
.crew{font-size:0.72rem;font-weight:600;line-height:1.15;}
.crew-sub{font-size:0.58rem;color:var(--muted);line-height:1.15;text-transform:uppercase;
  letter-spacing:0.05em;}
.lane{position:relative;flex:1;}
.ruler{display:flex;background:var(--sand);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:4;}
.ruler .rowhead{background:var(--sand);}
.ruler-lane{position:relative;flex:1;height:15px;}
.tick{position:absolute;bottom:1px;font-size:0.57rem;color:var(--muted);
  transform:translateX(-50%);white-space:nowrap;}
.gl{position:absolute;top:0;bottom:0;width:1px;background:rgba(216,207,191,0.5);}

/* Colour is READINESS, not job type — this board is about what needs rescuing */
.blk{position:absolute;top:3px;bottom:3px;border-radius:3px;padding:2px 5px;overflow:hidden;
  color:#fff;font-size:0.63rem;line-height:1.2;border-left:3px solid rgba(0,0,0,0.22);}
.blk.late{background:var(--red);}
.blk.due{background:var(--amber);}
.blk.ok{background:var(--ontrack);}
.blk.done{background:var(--green);}
.blk-top{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.blk-sub{opacity:0.93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:0.59rem;}
.bang{display:inline-block;width:12px;height:12px;border-radius:50%;background:#fff;
  color:var(--red);font-size:0.57rem;font-weight:700;text-align:center;line-height:12px;
  margin-right:4px;vertical-align:0.5px;}
.empty{padding:7px 12px;color:var(--muted);font-size:0.68rem;}
.msg{padding:30px;text-align:center;color:var(--muted);}
</style>
</head>
<body>

<div class="bar">
  <img src="/static/luma-mark-light.png" alt="LUMA"/>
  <span class="bar-title">Readiness</span>
  <div class="legend">
    <span class="lg"><i style="background:#A63D2F"></i>Behind</span>
    <span class="lg"><i style="background:#C88A2E"></i>Due</span>
    <span class="lg"><i style="background:#8D8577"></i>On track</span>
    <span class="lg"><i style="background:#4A7C59"></i>Ready</span>
    <button class="fs" id="fs-btn" onclick="toggleFull()">Full screen</button>
  </div>
</div>

<div class="days" id="days"><div class="msg">Loading…</div></div>

<script>
const DAY_START=7*60+30, DAY_END=15*60+30;
const DAY_LABEL=['Today','Tomorrow','Day after'];
const KIND={install:'Install',to_load:'Load truck',bay:'Load bay'};
let DATA={days:[],jobs:[],teams:[],rules:{}};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin=t=>{
  if(!t) return null;
  const [h,m]=String(t).split(':').map(Number);
  return (isNaN(h)||isNaN(m))?null:h*60+m;
};
const fmtH=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
const street=a=>String(a||'').split(',')[0].trim();
function shortDate(iso){
  try{
    return new Date(iso+'T00:00:00')
      .toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
  }catch(e){ return iso; }
}

// Say the shortfall that needs rescuing, not just the stage name
function blurb(j){
  const st=j.stages||[];
  const bad=st.filter(s=>s.state==='late') .concat(st.filter(s=>s.state==='due'));
  const s=bad[0]||st[0];
  if(!s) return KIND[j.kind]||j.kind;
  if(s.total && s.done<s.total) return `${s.name} ${s.done}/${s.total}`;
  return s.note || `${s.name} done`;
}

function blockHTML(j){
  const t=toMin(j.time);
  const start=(t===null)?DAY_START:Math.min(Math.max(DAY_START,t),DAY_END-30);
  const dur=Math.max(30,j.duration||60);
  const left=(start-DAY_START)/(DAY_END-DAY_START)*100;
  const width=Math.max(4,Math.min(100-left,dur/(DAY_END-DAY_START)*100));
  // Read-only, so everything sits in the tooltip rather than behind a tap
  const detail=(j.stages||[]).map(s=>
    `${s.name}: ${s.total?`${s.done}/${s.total}`:'—'}${s.note?' ('+s.note+')':''}`).join('\n');
  const head=`${j.ref} · ${KIND[j.kind]||j.kind}`;
  return `<div class="blk ${j.worst}" style="left:${left}%;width:${width}%"
      title="${esc(head)}\n${esc(street(j.address))}${j.install_date?'\nInstalls '+esc(shortDate(j.install_date)):''}\n${esc(detail)}">
    <div class="blk-top">${j.worst==='late'?'<span class="bang">!</span>':''}${esc(j.ref)}</div>
    <div class="blk-sub">${esc(blurb(j))}</div>
  </div>`;
}

function render(){
  const wrap=document.getElementById('days');
  const teamsByDay={}, rowsByDay={};
  (DATA.days||[]).forEach(d=>{ teamsByDay[d]=[]; rowsByDay[d]=[]; });
  (DATA.teams||[]).forEach(t=>{ if(teamsByDay[t.date]) teamsByDay[t.date].push(t); });
  (DATA.jobs||[]).forEach(j=>{ if(rowsByDay[j.date]) rowsByDay[j.date].push(j); });

  wrap.innerHTML=(DATA.days||[]).map((d,i)=>{
    const teams=teamsByDay[d]||[], rows=rowsByDay[d]||[];
    const late=rows.filter(r=>r.worst==='late').length;

    const groups=teams.map(t=>({team:t,
      rows:rows.filter(r=>r.team_id===t.id ||
        (!r.team_id && r.vehicle && r.vehicle===t.vehicle))}));
    // Work nobody has been given is exactly what gets missed — show it.
    const placed=new Set(groups.flatMap(g=>g.rows));
    const loose=rows.filter(r=>!placed.has(r));
    if(loose.length) groups.push({team:{id:'_',name:'Unassigned',function:''},rows:loose});

    let ticks='',gl='';
    for(let m=DAY_START;m<=DAY_END;m+=60){
      const pct=(m-DAY_START)/(DAY_END-DAY_START)*100;
      ticks+=`<div class="tick" style="left:${pct}%">${fmtH(m)}</div>`;
      gl+=`<div class="gl" style="left:${pct}%"></div>`;
    }

    const body=groups.length
      ? groups.map(g=>`
        <div class="rowline">
          <div class="rowhead">
            <div class="crew">${esc(g.team.name||g.team.vehicle||'Team')}</div>
            <div class="crew-sub">${esc(g.team.function||'')}</div>
          </div>
          <div class="lane">${gl}${g.rows.map(blockHTML).join('')}</div>
        </div>`).join('')
      : '<div class="empty">Nothing scheduled</div>';

    return `<section class="day">
      <div class="day-hdr">
        <span class="day-name">${DAY_LABEL[i]||''}</span>
        <span class="day-date">${shortDate(d)}</span>
        ${late?`<span class="day-late">${late} need rescuing</span>`:''}
      </div>
      <div class="day-body">
        <div class="ruler"><div class="rowhead"></div><div class="ruler-lane">${ticks}</div></div>
        ${body}
      </div>
    </section>`;
  }).join('');
}

function toggleFull(){
  const el=document.documentElement;
  try{
    if(!document.fullscreenElement){
      (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);
    }else{
      (document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document);
    }
  }catch(e){ /* not supported — the page still works */ }
}
document.addEventListener('fullscreenchange',()=>{
  const b=document.getElementById('fs-btn');
  if(b) b.textContent=document.fullscreenElement?'Exit full screen':'Full screen';
});

async function load(){
  try{
    const res=await fetch('/api/readiness');
    DATA=await res.json();
    if(DATA && DATA.error){
      document.getElementById('days').innerHTML=
        '<div class="msg">Could not build the board.<br><code style="font-size:0.7rem">'+
        String(DATA.error).replace(/[<>]/g,'')+'</code></div>';
      return;
    }
    render();
  }catch(e){
    document.getElementById('days').innerHTML=
      '<div class="msg">Could not load. Check the connection and try again.</div>';
  }
}
load();
setInterval(load,120000);   // meant to be left on a screen
</script>
</body>
</html>
