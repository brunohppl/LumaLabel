<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deliveries — LUMA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#1A1714; --muted:#9A8F80; --border:#D8CFBF;
  --warm:#F7F4EE; --sand:#EFE9DE; --accent:#B8935A;
  --green:#4A7C59; --red:#A63D2F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--warm);color:var(--ink);font-family:'Jost',sans-serif;font-size:0.9rem;}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:white;border-bottom:1px solid var(--border);}
.logo-mark{height:34px;width:auto;display:block;}
.dept-tag{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);border:1px solid var(--border);border-radius:2px;padding:3px 8px;}
.page-wrap{max-width:1400px;margin:0 auto;padding:24px 22px 60px;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:400;margin:0 0 2px;}
.page-title span{color:var(--accent);}
.page-sub{font-size:0.8rem;color:var(--muted);margin-bottom:22px;}

.dropzone{border:1px dashed var(--border);background:white;border-radius:4px;padding:34px 22px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:#fffdf9;}
.dropzone-title{font-family:'Cormorant Garamond',serif;font-size:1.25rem;margin-bottom:4px;}
.dropzone-hint{font-size:0.78rem;color:var(--muted);}

.notice{border-radius:4px;padding:12px 16px;font-size:0.83rem;margin-top:16px;}
.notice.err{background:rgba(166,61,47,0.07);border:1px solid var(--red);color:var(--red);}
.notice.info{background:white;border:1px solid var(--border);color:var(--muted);}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 6px;}
.stat{background:white;border:1px solid var(--border);border-radius:4px;padding:11px 16px;min-width:104px;}
.stat-n{font-family:'Cormorant Garamond',serif;font-size:1.5rem;line-height:1.1;}
.stat-l{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-top:2px;}
.stat.accent .stat-n{color:var(--accent);}

.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0 12px;flex-wrap:wrap;}
.search{flex:1;min-width:240px;padding:10px 13px;border:1px solid var(--border);border-radius:3px;font-family:inherit;font-size:0.87rem;background:white;}
.search:focus{outline:none;border-color:var(--accent);}
.chip{border:1px solid var(--border);background:white;border-radius:14px;padding:6px 13px;font-size:0.74rem;cursor:pointer;font-family:inherit;color:var(--muted);}
.chip.on{background:var(--ink);color:white;border-color:var(--ink);}
.result-count{font-size:0.75rem;color:var(--muted);}

table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
th{text-align:left;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px;border-bottom:1px solid var(--sand);vertical-align:top;font-size:0.83rem;}
tr:last-child td{border-bottom:none;}
tr.service{background:#fcfbf8;color:var(--muted);}
.sec{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);white-space:nowrap;}
.pname{font-weight:500;}
.pmeta{font-size:0.73rem;color:var(--muted);margin-top:2px;}
.sku{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.76rem;color:var(--accent);}
.sku.none{color:var(--border);font-family:inherit;font-style:italic;}
.qty{font-weight:600;text-align:center;}
.badge{display:inline-block;font-size:0.66rem;border-radius:10px;padding:2px 9px;letter-spacing:0.04em;white-space:nowrap;}
.b-delivered{background:rgba(74,124,89,0.13);color:var(--green);}
.b-paid{background:rgba(184,147,90,0.15);color:var(--accent);}
.b-other{background:var(--sand);color:var(--muted);}
.b-service{background:var(--sand);color:var(--muted);}
.btn-primary{background:var(--ink);color:white;border:none;border-radius:3px;padding:10px 18px;font-family:'Jost',sans-serif;font-size:0.78rem;letter-spacing:0.07em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.btn-primary:hover{opacity:0.88;}
.btn-primary:disabled{opacity:0.45;cursor:not-allowed;}
.backlink{background:none;border:none;color:var(--muted);font-family:inherit;font-size:0.78rem;cursor:pointer;padding:0 0 10px;}
.backlink:hover{color:var(--ink);}
.fl{display:block;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin-bottom:4px;}
.save-bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:white;border:1px solid var(--border);border-radius:4px;padding:14px 16px;margin:14px 0;}
.pcard{display:block;width:100%;text-align:left;background:white;border:1px solid var(--border);border-radius:4px;padding:16px 18px;margin-bottom:10px;cursor:pointer;font-family:inherit;transition:border-color .15s;}
.pcard:hover{border-color:var(--accent);}
.pcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
.pcard-name{font-family:'Cormorant Garamond',serif;font-size:1.3rem;}
.pcard-meta{font-size:0.75rem;color:var(--muted);}
.bar{height:5px;background:var(--sand);border-radius:3px;margin-top:11px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;}
.bar-fill.done{background:var(--green);}
.recv{display:inline-flex;align-items:center;gap:4px;}
.recv-btn{width:26px;height:26px;border:1px solid var(--border);background:white;border-radius:3px;cursor:pointer;font-family:inherit;font-size:0.9rem;line-height:1;color:var(--ink);padding:0;}
.recv-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.recv-btn:disabled{opacity:0.3;cursor:not-allowed;}
.recv-n{min-width:42px;text-align:center;font-weight:600;font-size:0.85rem;}
.recv-all{border:1px solid var(--border);background:white;border-radius:3px;padding:4px 9px;font-family:inherit;font-size:0.7rem;cursor:pointer;color:var(--muted);white-space:nowrap;}
.recv-all:hover{border-color:var(--green);color:var(--green);}
tr.done{background:rgba(74,124,89,0.05);}
tr.part{background:rgba(184,147,90,0.06);}
.row-tick{color:var(--green);font-weight:600;}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:0.83rem;}
.spinner{width:15px;height:15px;border:2px solid var(--sand);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:7px;}
@keyframes spin{to{transform:rotate(360deg);}}
.edit-btn{background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;
  padding:3px 8px;font-size:0.85rem;color:var(--muted);}
.edit-btn:hover{border-color:var(--accent);color:var(--ink);}
.edit-pop{display:none;position:fixed;inset:0;background:rgba(26,23,20,0.45);
  z-index:200;align-items:center;justify-content:center;padding:20px;}
.edit-pop.open{display:flex;}
.edit-card{background:#fff;border-radius:12px;padding:22px;max-width:620px;width:100%;
  max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,0.28);}
.edit-head{font-size:1.05rem;font-weight:600;margin-bottom:14px;}
.edit-sub{font-size:0.78rem;font-weight:400;color:var(--muted);margin-left:8px;}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.edit-grid label{display:flex;flex-direction:column;font-size:0.7rem;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);gap:5px;}
.edit-grid label.wide{grid-column:1/-1;}
.edit-grid label.check{flex-direction:row;align-items:center;gap:8px;text-transform:none;
  letter-spacing:0;font-size:0.82rem;font-weight:500;color:var(--ink);}
.edit-grid input[type=text],.edit-grid input[type=number]{padding:8px 10px;border:1px solid var(--border);
  border-radius:6px;font-family:inherit;font-size:0.9rem;color:var(--ink);}
.edit-err{color:#C0392B;font-size:0.82rem;min-height:18px;margin-top:10px;}
.edit-actions{display:flex;gap:10px;align-items:center;margin-top:6px;}
.btn-del{background:none;border:1px solid #C0392B;color:#C0392B;border-radius:6px;
  padding:8px 14px;cursor:pointer;font-family:inherit;font-size:0.85rem;}
</style>
</head>
<body>

<header>
  <img class="logo-mark" src="/static/luma-logo.png" alt="LUMA"/>
  <div class="dept-tag">Deliveries · testing</div>
</header>

<div class="page-wrap">

  <!-- ══ View: project list ══ -->
  <div id="view-list">
    <h1 class="page-title">Deliveries<span>.</span></h1>
    <div class="page-sub">Import a Programma schedule, then check arriving stock against it.</div>
    <div class="toolbar">
      <input class="search" id="pq" placeholder="Search projects…" oninput="renderProjects()"/>
      <button class="btn-primary" onclick="showImport()">+ New import</button>
    </div>
    <div id="project-list"></div>
  </div>

  <!-- ══ View: import ══ -->
  <div id="view-import" style="display:none;">
    <button class="backlink" onclick="showList()">← All projects</button>
    <h1 class="page-title">New import<span>.</span></h1>
    <div class="page-sub">Upload a Programma schedule export, check it looks right, then save it as a project.</div>

    <div class="dropzone" id="drop" onclick="document.getElementById('file').click()">
      <div class="dropzone-title">Drop a Programma export here</div>
      <div class="dropzone-hint">or tap to choose a file — .xlsx schedule export</div>
    </div>
    <input type="file" id="file" accept=".xlsx" style="display:none;" onchange="upload(this.files[0])"/>
    <div id="msg"></div>

    <div id="preview" style="display:none;">
      <div class="stats" id="stats"></div>
      <div class="save-bar">
        <div style="flex:1;min-width:220px;">
          <label class="fl">Project name</label>
          <input class="search" id="pname" style="width:100%;" placeholder="e.g. Somers Residence"/>
        </div>
        <button class="btn-primary" id="btn-save" onclick="saveProject()">Save project</button>
      </div>
      <div class="toolbar">
        <input class="search" id="q" placeholder="Search by product name, SKU, brand or room…" oninput="renderLines()"/>
        <button class="chip on" id="chip-items" onclick="toggleChip(false)">Items only</button>
        <button class="chip" id="chip-all" onclick="toggleChip(true)">Include budget lines</button>
        <span class="result-count" id="count"></span>
      </div>
      <div id="table-wrap"></div>
    </div>
  </div>

  <!-- ══ View: one project ══ -->
  <div id="view-project" style="display:none;">
    <button class="backlink" onclick="showList()">← All projects</button>
    <h1 class="page-title" id="proj-title"></h1>
    <div class="page-sub" id="proj-sub"></div>
    <div class="stats" id="proj-stats"></div>
    <div class="toolbar">
      <input class="search" id="pq2" placeholder="Search by product name, SKU, brand or room…" oninput="renderProjectLines()"/>
      <button class="chip on" id="f-all" onclick="setFilter('all')">All</button>
      <button class="chip" id="f-out" onclick="setFilter('outstanding')">Outstanding</button>
      <button class="chip" id="f-done" onclick="setFilter('received')">Received</button>
      <button class="chip" id="chip2-all" onclick="toggleChip2(!showService2)">Budget lines</button>
      <span class="result-count" id="count2"></span>
    </div>
    <div id="proj-table"></div>
  </div>

</div>

<script>
let LINES = [], PROJECTS = [], PROJ = null, PROJ_LINES = [];
let showService = false, showService2 = false;

// ───────────────── view switching ─────────────────
function show(view){
  ['list','import','project'].forEach(v=>{
    document.getElementById('view-'+v).style.display = (v===view) ? 'block' : 'none';
  });
  window.scrollTo(0,0);
}
function showList(){ show('list'); loadProjects(); }
function showImport(){
  LINES=[]; msg('');
  document.getElementById('preview').style.display='none';
  document.getElementById('file').value='';
  show('import');
}

function msg(html, cls){
  document.getElementById('msg').innerHTML = html ? `<div class="notice ${cls||'info'}">${html}</div>` : '';
}

async function api(url, opts){
  let res, data;
  try{ res = await fetch(url, opts); }
  catch(e){ return {ok:false, error:'Could not reach the server. Check your connection and try again.'}; }
  try{ data = await res.json(); }
  catch(e){
    const raw = await res.text().catch(()=> '');
    return {ok:false, error:`Server returned an unexpected response (HTTP ${res.status}). ${(raw||'').slice(0,300)}`};
  }
  if(!res.ok || !data.success) return {ok:false, error:data.error||`Request failed (HTTP ${res.status}).`};
  return {ok:true, data};
}

// ───────────────── project list ─────────────────
async function loadProjects(){
  const el = document.getElementById('project-list');
  el.innerHTML = '<div class="empty"><span class="spinner"></span>Loading projects…</div>';
  const r = await api('/api/deliveries/projects');
  if(!r.ok){ el.innerHTML = `<div class="notice err">${r.error}</div>`; return; }
  PROJECTS = r.data.projects;
  renderProjects();
}

function renderProjects(){
  const el = document.getElementById('project-list');
  const q = (document.getElementById('pq').value||'').trim().toLowerCase();
  const list = q ? PROJECTS.filter(p=>(p.name||'').toLowerCase().includes(q)) : PROJECTS;

  if(!PROJECTS.length){
    el.innerHTML = `<div class="empty">No projects yet. Import a Programma schedule to get started.</div>`;
    return;
  }
  if(!list.length){ el.innerHTML = `<div class="empty">No project matches “${q}”.</div>`; return; }

  el.innerHTML = list.map(p=>`
    <button class="pcard" onclick="openProject('${p.id}')">
      <div class="pcard-top">
        <span class="pcard-name">${p.name}</span>
        <span class="pcard-meta">${p.units_received} of ${p.units_expected} units received</span>
      </div>
      <div class="pcard-meta">${p.item_count} items${p.source_filename?' · '+p.source_filename:''}</div>
      <div class="bar"><div class="bar-fill ${p.complete?'done':''}" style="width:${p.pct}%;"></div></div>
    </button>`).join('');
}

// ───────────────── open one project ─────────────────
async function openProject(id){
  show('project');
  document.getElementById('proj-title').textContent = 'Loading…';
  document.getElementById('proj-sub').textContent = '';
  document.getElementById('proj-stats').innerHTML = '';
  document.getElementById('proj-table').innerHTML = '';
  const r = await api('/api/deliveries/projects/'+id);
  if(!r.ok){
    document.getElementById('proj-title').textContent = 'Deliveries';
    document.getElementById('proj-table').innerHTML = `<div class="notice err">${r.error}</div>`;
    return;
  }
  PROJ = r.data.project; PROJ_LINES = r.data.lines;
  document.getElementById('proj-title').innerHTML = PROJ.name + '<span>.</span>';
  document.getElementById('proj-sub').textContent =
    `${PROJ.item_count} items · ${PROJ.units_received} of ${PROJ.units_expected} units received`;
  document.getElementById('proj-stats').innerHTML = statsHTML({
    deliverable: PROJ.item_count,
    units: PROJ.units_expected,
    sections: new Set(PROJ_LINES.filter(l=>l.section).map(l=>l.section)).size,
    missing_sku: PROJ_LINES.filter(l=>!l.is_service && !l.sku).length,
    service: PROJ_LINES.filter(l=>l.is_service).length,
  });
  renderProjectLines();
}

// ───────────────── import ─────────────────
const drop = document.getElementById('drop');
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');}));
drop.addEventListener('drop',e=>{ if(e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });

let LAST_FILE = null, LAST_META = null;

async function upload(file){
  if(!file) return;
  if(!file.name.toLowerCase().endsWith('.xlsx')){
    msg('That file isn\'t an .xlsx. Export the schedule from Programma as Excel and try again.','err');
    return;
  }
  msg('<span class="spinner"></span>Reading ' + file.name + '…');
  document.getElementById('preview').style.display='none';

  const fd = new FormData(); fd.append('file', file);
  const r = await api('/api/deliveries/parse', {method:'POST', body:fd});
  if(!r.ok){ msg('Could not read that file — ' + r.error, 'err'); return; }

  const d = r.data;
  LINES = d.lines; LAST_FILE = d.filename; LAST_META = d.meta;
  msg('');
  document.getElementById('preview').style.display='block';
  document.getElementById('stats').innerHTML = statsHTML(d.counts);
  const nameEl = document.getElementById('pname');
  if(!nameEl.value) nameEl.value = d.meta.project || file.name.replace(/\.xlsx$/i,'');
  renderLines();
}

function statsHTML(c){
  return `
    <div class="stat"><div class="stat-n">${c.deliverable}</div><div class="stat-l">Items</div></div>
    <div class="stat accent"><div class="stat-n">${c.units}</div><div class="stat-l">Units expected</div></div>
    <div class="stat"><div class="stat-n">${c.sections}</div><div class="stat-l">Rooms</div></div>
    <div class="stat"><div class="stat-n">${c.missing_sku}</div><div class="stat-l">Without SKU</div></div>
    <div class="stat"><div class="stat-n">${c.service}</div><div class="stat-l">Budget lines</div></div>`;
}

async function saveProject(){
  const name = document.getElementById('pname').value.trim();
  if(!name){ msg('Give the project a name before saving.','err'); document.getElementById('pname').focus(); return; }
  if(!LINES.length){ msg('There is nothing to save yet.','err'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const r = await api('/api/deliveries/projects', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, filename:LAST_FILE, meta:LAST_META, lines:LINES})
  });
  btn.disabled = false; btn.textContent = 'Save project';

  if(!r.ok){ msg('Could not save — ' + r.error, 'err'); return; }
  openProject(r.data.project.id);
}

// ───────────────── shared line rendering ─────────────────
function toggleChip(on){
  showService = on;
  document.getElementById('chip-items').classList.toggle('on', !on);
  document.getElementById('chip-all').classList.toggle('on', on);
  renderLines();
}
function toggleChip2(on){
  showService2 = on;
  document.getElementById('chip2-all').classList.toggle('on', on);
  renderProjectLines();
}

let statusFilter = 'all';
function setFilter(f){
  statusFilter = f;
  ['all','out','done'].forEach(k=>{
    const map = {all:'all', out:'outstanding', done:'received'};
    document.getElementById('f-'+k).classList.toggle('on', map[k] === f);
  });
  renderProjectLines();
}

function rowClass(l){
  const exp = l.qty_expected||0, got = l.qty_received||0;
  if(exp && got >= exp) return 'done';
  if(got > 0) return 'part';
  return '';
}

// Inline receive control: − n / expected + , plus a one-tap "all"
function receiveCell(l){
  const exp = l.qty_expected||0, got = l.qty_received||0;
  const full = exp && got >= exp;
  return `<span class="recv">
    <button class="recv-btn" ${got<=0?'disabled':''} title="Remove one"
      onclick="checkLine('${l.id}',{delta:-1})">−</button>
    <span class="recv-n ${full?'row-tick':''}">${full?'✓ ':''}${got}/${exp}</span>
    <button class="recv-btn" ${full?'disabled':''} title="Receive one"
      onclick="checkLine('${l.id}',{delta:1})">+</button>
    ${exp>1 && !full ? `<button class="recv-all" onclick="checkLine('${l.id}',{qty:${exp}})">all</button>` : ''}
    ${full ? `<button class="recv-all" onclick="checkLine('${l.id}',{qty:0})">undo</button>` : ''}
  </span>`;
}

// Optimistic: update the number immediately, roll back visibly if the save fails
async function checkLine(lineId, change){
  const line = PROJ_LINES.find(l=>l.id===lineId);
  if(!line) return;
  const before = line.qty_received||0;
  const exp = line.qty_expected||0;
  const optimistic = ('qty' in change) ? change.qty : before + change.delta;
  line.qty_received = Math.max(0, Math.min(optimistic, exp));
  refreshProgress();
  renderProjectLines();

  const r = await api(`/api/deliveries/lines/${lineId}/check`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(change)
  });

  if(!r.ok){
    line.qty_received = before;   // put it back
    refreshProgress();
    renderProjectLines();
    alert('Could not save that — ' + r.error);
    return;
  }
  if(r.data.line) line.qty_received = r.data.line.qty_received;
  refreshProgress();
}

function refreshProgress(){
  const items = PROJ_LINES.filter(l=>!l.is_service);
  const exp = items.reduce((s,l)=>s+(l.qty_expected||0),0);
  const got = items.reduce((s,l)=>s+(l.qty_received||0),0);
  PROJ.units_expected = exp; PROJ.units_received = got;
  const sub = document.getElementById('proj-sub');
  if(sub) sub.textContent = `${items.length} items · ${got} of ${exp} units received`
    + (exp && got>=exp ? ' · complete' : '');
}

function filterLines(all, q, withService){
  let rows = withService ? all : all.filter(l=>!l.is_service);
  if(q){
    const terms = q.split(/\s+/);
    rows = rows.filter(l=>{
      const hay = [l.product_name,l.item_label,l.sku,l.brand,l.section,l.colour,l.supplier]
        .filter(Boolean).join(' ').toLowerCase();
      return terms.every(t=>hay.includes(t));
    });
  }
  return rows;
}

function statusBadge(s){
  if(!s) return '<span class="badge b-other">—</span>';
  const cls = s==='delivered' ? 'b-delivered' : (s==='paid' ? 'b-paid' : 'b-other');
  return `<span class="badge ${cls}">${s.replace(/_/g,' ')}</span>`;
}

function tableHTML(rows, q, showReceived){
  if(!rows.length){
    return `<div class="empty">Nothing matches “${q}”. Try a shorter search — part of a product name, or the first few characters of a SKU.</div>`;
  }
  return `<table>
    <thead><tr>
      <th>Room</th><th>Item</th><th>SKU</th><th>Brand</th>
      <th style="text-align:center;">Qty</th>
      ${showReceived?'<th style="text-align:center;">Received</th>':''}
      <th>Programma Status</th>
      ${showReceived?'<th></th>':''}
    </tr></thead>
    <tbody>${rows.map(l=>`
      <tr class="${l.is_service?'service':rowClass(l)}" id="row-${l.id||''}">
        <td class="sec">${l.section||'—'}</td>
        <td>
          <div class="pname">${l.product_name||l.item_label||'—'}</div>
          ${l.product_name&&l.item_label?`<div class="pmeta">${l.item_label}</div>`:''}
          ${l.colour?`<div class="pmeta">${l.colour}</div>`:''}
        </td>
        <td>${l.sku?`<span class="sku">${l.sku}</span>`:'<span class="sku none">none</span>'}</td>
        <td>${l.brand||'—'}</td>
        <td class="qty">${l.is_service?'—':l.qty_expected}</td>
        ${showReceived?`<td>${l.is_service?'<span class="qty">—</span>':receiveCell(l)}</td>`:''}
        <td>${l.is_service?'<span class="badge b-service">budget line</span>':statusBadge(l.programma_status)}</td>
        ${showReceived?`<td><button class="edit-btn" onclick="openEdit('${l.id}')" title="Correct this line">✎</button></td>`:''}
      </tr>`).join('')}
    </tbody></table>`;
}

function renderLines(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const rows = filterLines(LINES, q, showService);
  document.getElementById('count').textContent = `${rows.length} ${rows.length===1?'line':'lines'}${q?' matching':''}`;
  document.getElementById('table-wrap').innerHTML = tableHTML(rows, q, false);
}

function renderProjectLines(){
  const q = document.getElementById('pq2').value.trim().toLowerCase();
  let rows = filterLines(PROJ_LINES, q, showService2);
  if(statusFilter !== 'all'){
    rows = rows.filter(l=>{
      if(l.is_service) return false;
      const full = (l.qty_expected||0) && (l.qty_received||0) >= l.qty_expected;
      return statusFilter === 'received' ? full : !full;
    });
  }
  document.getElementById('count2').textContent = `${rows.length} ${rows.length===1?'line':'lines'}${q?' matching':''}`;
  document.getElementById('proj-table').innerHTML = tableHTML(rows, q, true);
}

// ── Editing a line ─────────────────────────────────────────────
// Programma exports carry mistakes — a missing SKU, the wrong room, a
// quantity that changed after ordering. Correcting the line beats
// re-importing the project and losing the check-in history.
let editingId = null;

function openEdit(id){
  const l = PROJ_LINES.find(x=>x.id===id);
  if(!l) return;
  editingId = id;
  const f = (name, val) => document.getElementById(name).value = val || '';
  f('e-section', l.section);
  f('e-product', l.product_name);
  f('e-label', l.item_label);
  f('e-brand', l.brand);
  f('e-sku', l.sku);
  f('e-colour', l.colour);
  f('e-supplier', l.supplier);
  f('e-notes', l.notes);
  document.getElementById('e-qty').value = l.qty_expected || 1;
  document.getElementById('e-service').checked = !!l.is_service;
  document.getElementById('e-received').textContent =
    l.is_service ? '' : `${l.qty_received||0} already received`;
  document.getElementById('edit-err').textContent = '';
  document.getElementById('edit-pop').classList.add('open');
}

function closeEdit(){
  editingId = null;
  document.getElementById('edit-pop').classList.remove('open');
}

async function saveEdit(){
  if(!editingId) return;
  const v = id => document.getElementById(id).value.trim();
  const body = {
    section: v('e-section'), product_name: v('e-product'), item_label: v('e-label'),
    brand: v('e-brand'), sku: v('e-sku'), colour: v('e-colour'),
    supplier: v('e-supplier'), notes: v('e-notes'),
    qty_expected: parseInt(document.getElementById('e-qty').value, 10),
    is_service: document.getElementById('e-service').checked,
  };
  const err = document.getElementById('edit-err');
  if(!(body.qty_expected >= 1)){ err.textContent = 'Quantity must be at least 1.'; return; }

  const btn = document.getElementById('edit-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const res = await fetch(`/api/deliveries/lines/${editingId}`,{
      method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const data = await res.json().catch(()=>({}));
    if(!res.ok || data.success===false) throw new Error(data.error||`HTTP ${res.status}`);
    const i = PROJ_LINES.findIndex(x=>x.id===editingId);
    if(i>-1 && data.line) PROJ_LINES[i] = data.line;
    closeEdit();
    renderProjectLines();
  }catch(e){
    err.textContent = e.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Save';
  }
}

async function deleteLine(){
  if(!editingId) return;
  const l = PROJ_LINES.find(x=>x.id===editingId);
  if(!confirm(`Remove "${(l&&(l.product_name||l.item_label))||'this line'}" from the schedule?\n\nIts check-in history goes too. This can't be undone.`)) return;
  const err = document.getElementById('edit-err');
  try{
    const res = await fetch(`/api/deliveries/lines/${editingId}`,{method:'DELETE'});
    const data = await res.json().catch(()=>({}));
    if(!res.ok || data.success===false) throw new Error(data.error||`HTTP ${res.status}`);
    PROJ_LINES = PROJ_LINES.filter(x=>x.id!==editingId);
    closeEdit();
    renderProjectLines();
  }catch(e){ err.textContent = e.message; }
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeEdit(); });

loadProjects();
</script>
<div id="edit-pop" class="edit-pop">
  <div class="edit-card">
    <div class="edit-head">Edit line <span id="e-received" class="edit-sub"></span></div>
    <div class="edit-grid">
      <label>Room<input id="e-section" type="text"></label>
      <label>Quantity<input id="e-qty" type="number" min="1" step="1"></label>
      <label class="wide">Product<input id="e-product" type="text"></label>
      <label class="wide">Description<input id="e-label" type="text"></label>
      <label>Brand<input id="e-brand" type="text"></label>
      <label>SKU<input id="e-sku" type="text"></label>
      <label>Colour<input id="e-colour" type="text"></label>
      <label>Supplier<input id="e-supplier" type="text"></label>
      <label class="wide">Notes<input id="e-notes" type="text"></label>
      <label class="wide check"><input id="e-service" type="checkbox"> Budget or service line (nothing to deliver)</label>
    </div>
    <div id="edit-err" class="edit-err"></div>
    <div class="edit-actions">
      <button class="btn-del" onclick="deleteLine()">Delete line</button>
      <span style="flex:1"></span>
      <button class="btn-ghost" onclick="closeEdit()">Cancel</button>
      <button class="btn-go" id="edit-save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>
</body>
</html>
